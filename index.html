// ── HELPERS ───────────────────────────────────────────────────────────────────
const getDiscount = pax => { const t=DISCOUNT_TIERS.find(t=>pax>=t.min&&pax<=t.max); return t?t.discount:0; };
const calcDN = (dep,arr) => { if(!dep||!arr) return {days:0,nights:0}; const d=Math.round((new Date(arr)-new Date(dep))/86400000); return {days:d+1,nights:d}; };
const fmt = n => (n==null||n==="")?"—":"RM "+Number(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => d?new Date(d).toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"}):"—";
const ageYrs = dob => dob?Math.floor((Date.now()-new Date(dob))/31557600000):null;
const boolify = v => v===true||v==="TRUE"||v==="true";

function calcFare(cust,tour,activePax){
  const disc   = boolify(tour?.isSpecialDiscount) ? Number(tour.specialDiscount||0) : getDiscount(activePax);
  const normal = Number(tour?.normalPrice||0);
  const pkg    = normal-disc;
  const upg    = Number(cust.upgradeAmount||0);
  const ded    = boolify(cust.groundTourOnly) ? normal : 0;
  const fare   = pkg+upg-ded;
  const paid   = [cust.payment1,cust.payment2,cust.payment3].reduce((s,x)=>s+Number(x||0),0);
  return {disc,normal,pkg,upg,ded,fare,paid,balance:fare-paid};
}
const rowToObj=(headers,row)=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??""]));
const objToRow=(headers,obj)=>headers.map(h=>{const v=obj[h];if(v===true)return"TRUE";if(v===false)return"FALSE";return v??"";});

// ── GOOGLE API ────────────────────────────────────────────────────────────────
let _token=null;

async function sheetsReq(path,method="GET",body=null){
  if(!_token)throw new Error("NOT_SIGNED_IN");
  const opts={method,headers:{Authorization:`Bearer ${_token}`,"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${GC.SHEET_ID}${path}`,opts);
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||"Sheets API error");}
  return r.json();
}
async function ensureSheetTabs(){
  const meta=await sheetsReq("");
  const existing=meta.sheets.map(s=>s.properties.title);
  const requests=[];
  for(const name of [SHEETS.TOURS,SHEETS.CUSTOMERS]){
    if(!existing.includes(name))requests.push({addSheet:{properties:{title:name}}});
  }
  if(requests.length)await sheetsReq(":batchUpdate","POST",{requests});
}
async function getSheetRows(sheetName,cols){
  try{
    const r=await sheetsReq(`/values/${encodeURIComponent(sheetName)}`);
    const rows=r.values||[];
    if(rows.length<2)return[];
    const headers=rows[0].length?rows[0]:cols;
    return rows.slice(1).filter(r=>r.some(c=>c)).map(r=>rowToObj(headers,r));
  }catch{return[];}
}
async function writeAllRows(sheetName,cols,objects){
  await sheetsReq(`/values/${encodeURIComponent(sheetName)}:clear`,"POST");
  const values=[cols,...objects.map(o=>objToRow(cols,o))];
  await sheetsReq(`/values/${encodeURIComponent(sheetName)}?valueInputOption=RAW`,"PUT",{values});
}

// ── GOOGLE OAUTH ──────────────────────────────────────────────────────────────
function loadGSI(){
  return new Promise((res,rej)=>{
    if(window.google?.accounts?.oauth2){res();return;}
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}
async function signIn(onToken){
  await loadGSI();
  const client=window.google.accounts.oauth2.initTokenClient({
    client_id:GC.CLIENT_ID,scope:GC.SCOPES,
    callback:async(resp)=>{if(resp.error)return;_token=resp.access_token;onToken(_token);}
  });
  client.requestAccessToken();
}
function signOut(onDone){
  if(_token)window.google?.accounts?.oauth2?.revoke(_token,()=>{});
  _token=null;onDone();
}

// ── GOOGLE DRIVE ──────────────────────────────────────────────────────────────
async function ensureDriveFolder(tourCode){
  const q=encodeURIComponent(`name='${tourCode}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,{headers:{Authorization:`Bearer ${_token}`}});
  const {files}=await r.json();
  if(files?.length)return files[0].id;
  const cr=await fetch("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:{Authorization:`Bearer ${_token}`,"Content-Type":"application/json"},body:JSON.stringify({name:tourCode,mimeType:"application/vnd.google-apps.folder"})});
  return(await cr.json()).id;
}
async function uploadPassport(file,tourCode,custName){
  const folderId=await ensureDriveFolder(tourCode);
  const ext=file.name.split(".").pop();
  const meta=JSON.stringify({name:`${custName}_passport.${ext}`,parents:[folderId]});
  const form=new FormData();
  form.append("metadata",new Blob([meta],{type:"application/json"}));
  form.append("file",file);
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink",{method:"POST",headers:{Authorization:`Bearer ${_token}`},body:form});
  if(!r.ok)throw new Error("Upload failed");
  return(await r.json()).webViewLink;
}

// ACTION CENTRE AUTOMATION LOGIC — consolidated requirements update
// Preserves existing data, adds tour-level tasks and passport upload helpers.
// ─────────────────────────────────────────────────────────────────────────────
function daysUntilDeparture(tour){return tour?.departureDate?Math.ceil((new Date(tour.departureDate)-new Date())/86400000):9999}
function passportCloseToExpiry(c,tour){if(!c?.passportExpiry||!tour?.departureDate)return false;return (new Date(c.passportExpiry)-new Date(tour.departureDate))/2592000000<6}
function taskDone(tasks,tourCode,title,customerId=""){return (tasks||[]).some(t=>t.tourCode===tourCode&&t.title===title&&(customerId===""||!t.customerId||t.customerId===customerId)&&t.status==="Done")}
function actionTaskTitle(tourCode,title){return `${tourCode}_${title}`}
function getTourActionItems(tour,customers,tasks){
  const active=customers.filter(c=>isActiveInTour(c,tour.tourCode));
  const items=[];
  const days=daysUntilDeparture(tour);
  const pax=activePax(customers,tour.tourCode);
  const full=pax>=28;
  const hasOutstandingBalance=active.some(c=>calcFare(c,tour,customers).balance>0);
  const needsSecond=active.some(c=>Number(c.payment1||0)+Number(c.payment2||0)+Number(c.payment3||0)<6000);
  const needsPassport=active.some(c=>!c.passportDriveUrl);
  const expiringPassport=active.some(c=>passportCloseToExpiry(c,tour));
  const needDateUpdate=active.some(c=>tour.dateChangeNote&&!boolify(c.informedDateChange));
  const needCancelUpdate=active.some(c=>(tour.status==="Cancelled"||tour.cancelUpdateNote)&&!boolify(c.informedCancellation));
  const needItinUpdate=!!tour.itineraryUpdateNote;
  if(tour.status==="Confirmed"&&needsSecond)items.push({title:actionTaskTitle(tour.tourCode,"Collect 2nd Payment"),category:"Payment",amount:"",date:dateKey(new Date()),notes:`${active.length} active traveller(s); check who has not paid RM6,000 total.`});
  if((days<=46||full)&&hasOutstandingBalance)items.push({title:actionTaskTitle(tour.tourCode,"Collect Balance Payment"),category:"Payment",amount:"",date:dateKey(new Date()),notes:full?"Tour reached FULL pax.":"46 days before departure."});
  if(days<=60&&needsPassport)items.push({title:actionTaskTitle(tour.tourCode,"Collect Passport"),category:"Passport",amount:"",date:dateKey(new Date()),notes:"At least one active traveller has no uploaded passport file."});
  if(expiringPassport)items.push({title:actionTaskTitle(tour.tourCode,"Passport Expiry Reminder"),category:"Passport",amount:"",date:dateKey(new Date()),notes:"At least one passport is expired / less than 6 months from departure."});
  if(needDateUpdate)items.push({title:actionTaskTitle(tour.tourCode,"Notify Customers About Tour Date Change"),category:"Date Change",amount:"",date:dateKey(new Date()),notes:tour.dateChangeNote||"Tour date was edited."});
  if(needCancelUpdate)items.push({title:actionTaskTitle(tour.tourCode,"Notify Customers About Tour Cancellation"),category:"Cancellation",amount:"",date:dateKey(new Date()),notes:tour.cancelUpdateNote||"Tour status changed to Cancelled."});
  if(needItinUpdate)items.push({title:actionTaskTitle(tour.tourCode,"Notify Customers About Itinerary Update"),category:"Itinerary Update",amount:"",date:dateKey(new Date()),notes:tour.itineraryUpdateNote||"Itinerary update requires customer notification."});
  return items.map(x=>({...x,done:taskDone(tasks,tour.tourCode,x.title)}));
}
function pendingTasks(c,tour,customers){
  const out=[];
  if(c.status!=="Active"&&!isActiveInTour(c,tour.tourCode))return out;
  const f=calcFare(c,tour,customers);
  const paidTotal=Number(c.payment1||0)+Number(c.payment2||0)+Number(c.payment3||0);
  const days=daysUntilDeparture(tour);
  if(Number(c.payment1||0)<1000)out.push({title:"Collect 1st Payment",amount:1000-Number(c.payment1||0),category:"Payment"});
  if(tour.status==="Confirmed"&&paidTotal<6000)out.push({title:"Collect 2nd Payment",amount:6000-paidTotal,category:"Payment"});
  if(f.balance>0&&(days<=46||activePax(customers,tour.tourCode)>=28))out.push({title:"Collect Balance Payment",amount:f.balance,category:"Payment"});
  if(days<=60&&!c.passportDriveUrl)out.push({title:"Collect Passport",amount:"",category:"Passport"});
  if(passportCloseToExpiry(c,tour))out.push({title:"Passport Expiry Reminder",amount:"",category:"Passport"});
  if(tour.dateChangeNote&&!boolify(c.informedDateChange))out.push({title:"Notify Customers About Tour Date Change",amount:"",category:"Date Change"});
  if((tour.status==="Cancelled"||tour.cancelUpdateNote)&&!boolify(c.informedCancellation))out.push({title:"Notify Customers About Tour Cancellation",amount:"",category:"Cancellation"});
  if(tour.itineraryUpdateNote)out.push({title:"Notify Customers About Itinerary Update",amount:"",category:"Itinerary Update"});
  if(c.status==="Cancelled"&&Number(c.cancelRefundAmount||0)>0&&!boolify(c.cancelRefundDone))out.push({title:"Process Refund",amount:Number(c.cancelRefundAmount||0),category:"Refund"});
  if(c.status==="Transferred"&&!c.transferToTour)out.push({title:"Confirm Transfer Tour",amount:"",category:"Transfer"});
  return out;
}

async function uploadPassportIndexed(file,tourCode,cust,index){
  const folderId=await ensureDriveFolder(tourCode||"UNKNOWN");
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const safeName=fullName(cust).replace(/[^A-Z0-9]+/gi,"_").replace(/^_+|_+$/g,"")||"PASSPORT";
  const meta=JSON.stringify({name:`${String(index).padStart(2,"0")}_${safeName}.${ext}`,parents:[folderId]});
  const form=new FormData();
  form.append("metadata",new Blob([meta],{type:"application/json"}));
  form.append("file",file);
  const token=await ensureAccessToken();
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink",{method:"POST",headers:{Authorization:`Bearer ${token}`},body:form});
  if(!r.ok)throw new Error("Passport upload failed");
  return (await r.json()).webViewLink;
}

    h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}},
      h("label",{className:"btn primary",style:{cursor:"pointer"}},busy?"Uploading…":"Upload Passport",h("input",{type:"file",accept:"image/*,.pdf",style:{display:"none"},onChange:pick,disabled:busy})),

}
