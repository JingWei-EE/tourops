const GC = {

// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const DISCOUNT_TIERS = [
  {min:1,  max:10,       discount:1000, label:"1–10 pax: RM1,000 off"},
  {min:11, max:20,       discount:700,  label:"11–20 pax: RM700 off"},

];

const NATIONALITIES = ["Malaysian","Singaporean","Indonesian","Filipino","Thai","Other"];
const TOUR_STATUSES = ["Draft","Confirmed","Departed","Completed","Cancelled"];
const VISA_STATUSES = ["Not Required","Pending Application","Applied","Approved","Rejected"];

  "cancelRefundDone","cancelVoucherIssued","transferFromTour","transferToTour"];

// ── HELPERS ───────────────────────────────────────────────────────────────────
const getDiscount = pax => { const t=DISCOUNT_TIERS.find(t=>pax>=t.min&&pax<=t.max); return t?t.discount:0; };
const calcDN = (dep,arr) => { if(!dep||!arr) return {days:0,nights:0}; const d=Math.round((new Date(arr)-new Date(dep))/86400000); return {days:d+1,nights:d}; };
const fmt = n => (n==null||n==="")?"—":"RM "+Number(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => d?new Date(d).toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"}):"—";
const ageYrs = dob => dob?Math.floor((Date.now()-new Date(dob))/31557600000):null;
const boolify = v => v===true||v==="TRUE"||v==="true";

function calcFare(cust,tour,activePax){
  const disc   = boolify(tour?.isSpecialDiscount) ? Number(tour.specialDiscount||0) : getDiscount(activePax);
  const normal = Number(tour?.normalPrice||0);
  const pkg    = normal-disc;
  const upg    = Number(cust.upgradeAmount||0);
  const ded    = boolify(cust.groundTourOnly) ? normal : 0;
  const fare   = pkg+upg-ded;
  const paid   = [cust.payment1,cust.payment2,cust.payment3].reduce((s,x)=>s+Number(x||0),0);
  return {disc,normal,pkg,upg,ded,fare,paid,balance:fare-paid};
}
const rowToObj=(headers,row)=>Object.fromEntries(headers.map((h,i)=>[h,row[i]??""]));
const objToRow=(headers,obj)=>headers.map(h=>{const v=obj[h];if(v===true)return"TRUE";if(v===false)return"FALSE";return v??"";});

// ── GOOGLE API ────────────────────────────────────────────────────────────────
let _token=null;

async function sheetsReq(path,method="GET",body=null){
  if(!_token)throw new Error("NOT_SIGNED_IN");
  const opts={method,headers:{Authorization:`Bearer ${_token}`,"Content-Type":"application/json"}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${GC.SHEET_ID}${path}`,opts);
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||"Sheets API error");}
  return r.json();
}
async function ensureSheetTabs(){
  const meta=await sheetsReq("");
  const existing=meta.sheets.map(s=>s.properties.title);
  const requests=[];
  for(const name of [SHEETS.TOURS,SHEETS.CUSTOMERS]){
    if(!existing.includes(name))requests.push({addSheet:{properties:{title:name}}});
  }
  if(requests.length)await sheetsReq(":batchUpdate","POST",{requests});
}
async function getSheetRows(sheetName,cols){
  try{
    const r=await sheetsReq(`/values/${encodeURIComponent(sheetName)}`);
    const rows=r.values||[];
    if(rows.length<2)return[];
    const headers=rows[0].length?rows[0]:cols;
    return rows.slice(1).filter(r=>r.some(c=>c)).map(r=>rowToObj(headers,r));
  }catch{return[];}
}
async function writeAllRows(sheetName,cols,objects){
  await sheetsReq(`/values/${encodeURIComponent(sheetName)}:clear`,"POST");
  const values=[cols,...objects.map(o=>objToRow(cols,o))];
  await sheetsReq(`/values/${encodeURIComponent(sheetName)}?valueInputOption=RAW`,"PUT",{values});
}

// ── GOOGLE OAUTH ──────────────────────────────────────────────────────────────
function loadGSI(){
  return new Promise((res,rej)=>{
    if(window.google?.accounts?.oauth2){res();return;}
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}
async function signIn(onToken){
  await loadGSI();
  const client=window.google.accounts.oauth2.initTokenClient({
    client_id:GC.CLIENT_ID,scope:GC.SCOPES,
    callback:async(resp)=>{if(resp.error)return;_token=resp.access_token;onToken(_token);}
  });
  client.requestAccessToken();
}
function signOut(onDone){
  if(_token)window.google?.accounts?.oauth2?.revoke(_token,()=>{});
  _token=null;onDone();
}

// ── GOOGLE DRIVE ──────────────────────────────────────────────────────────────
async function ensureDriveFolder(tourCode){
  const q=encodeURIComponent(`name='${tourCode}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,{headers:{Authorization:`Bearer ${_token}`}});
  const {files}=await r.json();
  if(files?.length)return files[0].id;
  const cr=await fetch("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:{Authorization:`Bearer ${_token}`,"Content-Type":"application/json"},body:JSON.stringify({name:tourCode,mimeType:"application/vnd.google-apps.folder"})});
  return(await cr.json()).id;
}
async function uploadPassport(file,tourCode,custName){
  const folderId=await ensureDriveFolder(tourCode);
  const ext=file.name.split(".").pop();
  const meta=JSON.stringify({name:`${custName}_passport.${ext}`,parents:[folderId]});
  const form=new FormData();
  form.append("metadata",new Blob([meta],{type:"application/json"}));
  form.append("file",file);
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink",{method:"POST",headers:{Authorization:`Bearer ${_token}`},body:form});
  if(!r.ok)throw new Error("Upload failed");
  return(await r.json()).webViewLink;
}

// ── PRINT MANIFEST ────────────────────────────────────────────────────────────
function printManifest(tour,customers){
  const ap=customers.filter(c=>c.status==="Active").length;
  const disc=boolify(tour.isSpecialDiscount)?Number(tour.specialDiscount||0):getDiscount(ap);
  const priceToday=Number(tour.normalPrice||0)-disc;
  const dn=calcDN(tour.departureDate,tour.arrivalDate);
  const rows=customers.map((c,i)=>{
    const {fare,paid,balance}=calcFare(c,tour,ap);
    const warn=c.passportExpiry&&tour.departureDate&&(new Date(c.passportExpiry)-new Date(tour.departureDate))/2592000000<6;
    return `<tr><td>${i+1}</td><td><b>${c.title} ${c.surname} ${c.name}</b></td><td>${c.contact||"—"}</td><td>${c.passportNo||"—"}</td>
      <td style="${warn?"color:#dc2626;font-weight:700":""}">${fmtDate(c.passportExpiry)}${warn?" ⚠️":""}</td>
      <td>${c.roomType}${c.roomPartner?" / "+c.roomPartner:""}</td>
      <td>${c.mealRestriction!=="None"?c.mealRestriction:"—"}</td>
      <td>${c.flightRefCode||"—"}</td>
      <td style="${c.visaStatus==="Approved"?"color:#16a34a":c.visaStatus==="Rejected"?"color:#dc2626":""}">${c.visaStatus}</td>
      <td align="right"><b>${fmt(fare)}</b></td><td align="right" style="color:#16a34a">${fmt(paid)}</td>
      <td align="right" style="${balance>0?"color:#dc2626;font-weight:700":"color:#16a34a"}">${fmt(Math.abs(balance))}${balance<0?" CR":""}</td>
      <td align="center"><b>${c.status}</b></td></tr>`;
  }).join("");
  const tF=customers.reduce((s,c)=>s+calcFare(c,tour,ap).fare,0);
  const tP=customers.reduce((s,c)=>s+calcFare(c,tour,ap).paid,0);
  const tB=tF-tP;
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Manifest — ${tour.tourCode}</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;font-size:11px;padding:20px}
  h1{font-size:18px;color:#1e3a5f}table{width:100%;border-collapse:collapse}
  thead tr{background:#1e3a5f;color:#fff}th{padding:6px 7px;text-align:left;font-size:10px}
  td{padding:5px 7px;border-bottom:1px solid #e5e7eb}tr:nth-child(even){background:#f9fafb}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0;background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:6px}
  .lbl{font-size:9px;text-transform:uppercase;color:#6b7280;font-weight:700}.val{font-size:12px;font-weight:700}
  .tot{margin-top:12px;text-align:right;background:#f0fdf4;border:1px solid #bbf7d0;padding:10px 16px;border-radius:6px;display:flex;justify-content:flex-end;gap:24px}
  @media print{@page{margin:10mm}}</style></head><body>
  <div style="display:flex;justify-content:space-between;border-bottom:2px solid #1e3a5f;padding-bottom:12px;margin-bottom:12px">
    <div><div style="font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:1px">Tour Manifest</div>
    <h1>${tour.tourCode} — ${tour.tourName}</h1>
    <div style="color:#6b7280;margin-top:3px">${tour.airline||""} | Tour Manager: ${tour.tourManager||"—"}</div></div>
    <div style="text-align:right;font-size:10px;color:#6b7280">Printed: ${new Date().toLocaleString("en-MY")}</div>
  </div>
  <div class="grid">
    <div><div class="lbl">Departure</div><div class="val">${fmtDate(tour.departureDate)}</div></div>
    <div><div class="lbl">Arrival</div><div class="val">${fmtDate(tour.arrivalDate)}</div></div>
    <div><div class="lbl">Duration</div><div class="val">${dn.days>0?dn.days+"D / "+dn.nights+"N":"—"}</div></div>
    <div><div class="lbl">Pax</div><div class="val">${ap}</div></div>
    <div><div class="lbl">Normal Price</div><div class="val">${fmt(tour.normalPrice)}</div></div>
    <div><div class="lbl">Price Today</div><div class="val" style="color:#166534">${fmt(priceToday)}</div></div>
    <div><div class="lbl">Discount</div><div class="val">${fmt(disc)}</div></div>
    <div><div class="lbl">Single Supp.</div><div class="val">${fmt(tour.singleSupplement)}</div></div>
    <div><div class="lbl">Meal Incl.</div><div class="val">${tour.mealIncluded||"—"}</div></div>
    <div><div class="lbl">Meal Excl.</div><div class="val">${tour.mealExcluded||"—"}</div></div>
  </div>
  <table><thead><tr><th>#</th><th>Full Name</th><th>Contact</th><th>Passport No.</th><th>Expiry</th>
  <th>Room / Partner</th><th>Meal Pref.</th><th>Flight Ref</th><th>Visa</th>
  <th>Tour Fare</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead>
  <tbody>${rows}</tbody></table>
  <div class="tot">
    <div><div class="lbl">Total Fare</div><div class="val">${fmt(tF)}</div></div>
    <div><div class="lbl">Total Collected</div><div class="val">${fmt(tP)}</div></div>
    <div><div class="lbl">Outstanding</div><div class="val" style="color:${tB>0?"#dc2626":"#166534"}">${fmt(Math.abs(tB))}${tB<0?" CR":""}</div></div>
  </div>
  <div style="margin-top:20px;padding-top:10px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;font-size:9px;color:#9ca3af">
    <span>Tour Operations Management System</span><span>CONFIDENTIAL — Internal Use Only</span>
  </div>
  <script>window.onload=()=>window.print()<\/script></body></html>`;
  const w=window.open("","_blank");w.document.write(html);w.document.close();
}

// ── UI ATOMS ──────────────────────────────────────────────────────────────────
function Badge({status}){
  const m={Draft:"#94a3b8",Confirmed:"#3b82f6",Departed:"#f59e0b",Completed:"#22c55e",Cancelled:"#ef4444",Active:"#22c55e",Transferred:"#a855f7"};

function Inp({label,value,onChange,type="text",required,style,disabled,options,placeholder}){
  const b={width:"100%",padding:"7px 10px",border:"1px solid #d1d5db",borderRadius:7,fontSize:13,background:disabled?"#f3f4f6":"#fff",color:"#1e293b",boxSizing:"border-box",outline:"none"};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:3,...style}}>
      {label&&<label style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:.5}}>{label}{required&&<span style={{color:"#ef4444"}}> *</span>}</label>}
      {options
        ?<select value={value||""} onChange={e=>onChange(e.target.value)} disabled={disabled} style={b}><option value="">— Select —</option>{options.map(o=><option key={o}>{o}</option>)}</select>
        :<input type={type} value={value||""} onChange={e=>onChange(e.target.value)} disabled={disabled} placeholder={placeholder} style={b}/>}
    </div>
  );
}
function Chk({label,checked,onChange}){
  return <label style={{display:"flex",alignItems:"center",gap:7,fontSize:13,cursor:"pointer",color:"#334155",userSelect:"none"}}><input type="checkbox" checked={!!checked} onChange={e=>onChange(e.target.checked)} style={{width:15,height:15,accentColor:"#2563eb"}}/>{label}</label>;
}
function Card({children,style}){return <div style={{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",padding:20,...style}}>{children}</div>;}
function Sec({icon,title}){return <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,paddingBottom:10,borderBottom:"2px solid #f1f5f9"}}><span style={{fontSize:18}}>{icon}</span><span style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>{title}</span></div>;}
function Btn({children,onClick,variant="default",small,disabled}){
  const s={default:{background:"#fff",border:"1px solid #d1d5db",color:"#374151"},primary:{background:"#2563eb",border:"none",color:"#fff"},green:{background:"#16a34a",border:"none",color:"#fff"},ghost:{background:"transparent",border:"none",color:"#94a3b8"}};
  return <button onClick={onClick} disabled={disabled} style={{...s[variant]||s.default,padding:small?"5px 12px":"8px 18px",borderRadius:8,cursor:disabled?"not-allowed":"pointer",fontSize:small?11:13,fontWeight:600,display:"inline-flex",alignItems:"center",gap:5,opacity:disabled?.6:1}}>{children}</button>;
}
function G({n,gap=12,children}){return <div style={{display:"grid",gridTemplateColumns:`repeat(${n},1fr)`,gap}}>{children}</div>;}
function Spinner(){return <span style={{display:"inline-block",width:14,height:14,border:"2px solid rgba(255,255,255,.4)",borderTop:"2px solid #fff",borderRadius:"50%",animation:"spin .7s linear infinite"}}/>;}

function SyncBar({state,lastSync,error,onRetry}){
  const cfg={
    idle:  {bg:"#f1f5f9",col:"#64748b",icon:"☁️",txt:"Connected to Google Sheets"},
    saving:{bg:"#fef9c3",col:"#854d0e",icon:"⏳",txt:"Saving…"},

    error: {bg:"#fee2e2",col:"#dc2626",icon:"❌",txt:"Sync error: "+(error||"unknown")},

}

// ── PASSPORT UPLOAD ───────────────────────────────────────────────────────────
function PassportUpload({cust,tourCode,onSaved}){
  const [st,setSt]=useState("idle");
  const [url,setUrl]=useState(cust.passportDriveUrl||"");
  const ref=useRef();
  const handle=async e=>{
    const file=e.target.files[0];if(!file)return;
    setSt("uploading");
    try{const link=await uploadPassport(file,tourCode,`${cust.surname}_${cust.name}`);setUrl(link);setSt("done");onSaved(link);}
    catch{setSt("error");}
  };
  if(url) return(
    <div style={{display:"flex",alignItems:"center",gap:10,background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:9,padding:"10px 14px"}}>
      <span style={{fontSize:20}}>✅</span>
      <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13,color:"#166534"}}>Uploaded to Google Drive</div>
        <a href={url} target="_blank" rel="noreferrer" style={{fontSize:11,color:"#2563eb",wordBreak:"break-all"}}>{url}</a></div>
      <Btn small onClick={()=>ref.current.click()}>Replace</Btn>
      <input ref={ref} type="file" accept="image/*,.pdf" style={{display:"none"}} onChange={handle}/>
    </div>
  );
  return(
    <div>
      <div onClick={()=>ref.current.click()} style={{border:"2px dashed #cbd5e1",borderRadius:10,padding:24,textAlign:"center",cursor:"pointer",background:"#f8fafc"}} onMouseEnter={e=>e.currentTarget.style.borderColor="#2563eb"} onMouseLeave={e=>e.currentTarget.style.borderColor="#cbd5e1"}>
        <div style={{fontSize:32}}>{st==="uploading"?"⏳":"📷"}</div>
        <div style={{fontWeight:700,fontSize:13,color:"#475569",marginTop:6}}>{st==="uploading"?"Uploading to Google Drive…":"Click to upload passport photo / scan"}</div>
        <div style={{fontSize:11,color:"#94a3b8",marginTop:3}}>JPG, PNG or PDF · stored under <strong>/{tourCode}/</strong> in Drive</div>
        {st==="error"&&<div style={{color:"#dc2626",fontSize:12,marginTop:6}}>⚠️ Upload failed. Please try again.</div>}
      </div>
      <input ref={ref} type="file" accept="image/*,.pdf" style={{display:"none"}} onChange={handle}/>
    </div>
  );
}

// ── TOUR FORM ─────────────────────────────────────────────────────────────────
function TourForm({initial,onSave,onCancel,saving}){
  const [t,setT]=useState({...ET,...initial});
  const u=(k,v)=>setT(p=>({...p,[k]:v}));
  const dn=calcDN(t.departureDate,t.arrivalDate);
  const save=()=>{if(!t.tourCode||!t.tourName)return alert("Tour Code and Tour Name required.");onSave({...t,id:t.id||"tour_"+Date.now()});};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <G n={3}><Inp label="Tour Code" value={t.tourCode} onChange={v=>u("tourCode",v)} required/><Inp label="Tour Name" value={t.tourName} onChange={v=>u("tourName",v)} required style={{gridColumn:"span 2"}}/></G>
      <G n={3}><Inp label="Airline" value={t.airline} onChange={v=>u("airline",v)}/><Inp label="Tour Manager" value={t.tourManager} onChange={v=>u("tourManager",v)}/><Inp label="Status" value={t.status} onChange={v=>u("status",v)} options={TOUR_STATUSES}/></G>
      <G n={4}>
        <Inp label="Departure Date" value={t.departureDate} onChange={v=>u("departureDate",v)} type="date"/>
        <Inp label="Arrival Date" value={t.arrivalDate} onChange={v=>u("arrivalDate",v)} type="date"/>
        <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase"}}>Days / Nights</label><div style={{padding:"8px 10px",background:"#f8fafc",borderRadius:7,fontSize:13,border:"1px solid #e2e8f0",color:"#475569"}}>{dn.days>0?`${dn.days}D / ${dn.nights}N`:"—"}</div></div>
      </G>
      <div style={{background:"#f8fafc",padding:14,borderRadius:10}}>
        <div style={{fontWeight:700,fontSize:11,color:"#64748b",textTransform:"uppercase",marginBottom:10}}>Default Pricing & Inclusions</div>
        <G n={4}><Inp label="Normal Price (RM)" value={t.normalPrice} onChange={v=>u("normalPrice",v)} type="number" placeholder="0.00"/><Inp label="Single Supplement (RM)" value={t.singleSupplement} onChange={v=>u("singleSupplement",v)} type="number" placeholder="0.00"/><Inp label="Meal Included" value={t.mealIncluded} onChange={v=>u("mealIncluded",v)} placeholder="e.g. Breakfast"/><Inp label="Meal Excluded" value={t.mealExcluded} onChange={v=>u("mealExcluded",v)} placeholder="e.g. Lunch"/></G>
        <div style={{display:"flex",alignItems:"center",gap:14,marginTop:10}}>
          <Chk label="Override discount (special departure)" checked={boolify(t.isSpecialDiscount)} onChange={v=>u("isSpecialDiscount",v)}/>
          {boolify(t.isSpecialDiscount)&&<Inp label="Special Discount (RM)" value={t.specialDiscount} onChange={v=>u("specialDiscount",v)} type="number" style={{width:200}}/>}
        </div>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><Btn onClick={onCancel}>Cancel</Btn><Btn onClick={save} variant="primary" disabled={saving}>{saving?<><Spinner/> Saving…</>:"Save Tour"}</Btn></div>
    </div>
  );
}

// ── CUSTOMER SEARCH ───────────────────────────────────────────────────────────
function CustomerSearch({customers,tours,onEdit}){
  const [q,setQ]=useState(""); const [fT,setFT]=useState(""); const [fS,setFS]=useState(""); const [fV,setFV]=useState("");
  const codes=[...new Set(customers.map(c=>c.tourCode))].sort();
  const res=customers.filter(c=>{
    const s=q.toLowerCase();
    return(!q||`${c.surname} ${c.name}`.toLowerCase().includes(s)||c.contact?.includes(s)||c.email?.toLowerCase().includes(s)||c.passportNo?.toLowerCase().includes(s))
      &&(!fT||c.tourCode===fT)&&(!fS||c.status===fS)&&(!fV||c.visaStatus===fV);
  });
  const gt=code=>tours.find(t=>t.tourCode===code);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <G n={4} gap={10}>
        <div style={{position:"relative"}}><span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#94a3b8"}}>🔍</span><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Name, passport, contact, email…" style={{width:"100%",padding:"8px 10px 8px 32px",border:"1px solid #d1d5db",borderRadius:8,fontSize:13,outline:"none",boxSizing:"border-box"}}/></div>
        <select value={fT} onChange={e=>setFT(e.target.value)} style={{padding:"8px 10px",borderRadius:8,border:"1px solid #d1d5db",fontSize:13}}><option value="">All Tours</option>{codes.map(c=><option key={c}>{c}</option>)}</select>
        <select value={fS} onChange={e=>setFS(e.target.value)} style={{padding:"8px 10px",borderRadius:8,border:"1px solid #d1d5db",fontSize:13}}><option value="">All Status</option><option>Active</option><option>Transferred</option><option>Cancelled</option></select>
        <select value={fV} onChange={e=>setFV(e.target.value)} style={{padding:"8px 10px",borderRadius:8,border:"1px solid #d1d5db",fontSize:13}}><option value="">All Visa</option>{VISA_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
      </G>
      <div style={{fontSize:12,color:"#64748b"}}>{res.length} result{res.length!==1?"s":""}</div>
      <div style={{overflowX:"auto",maxHeight:460,overflowY:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead style={{position:"sticky",top:0}}><tr style={{background:"#1e293b",color:"#fff"}}>{["Name","Tour","Contact","Email","Passport No.","Expiry","Room","Visa","Fare","Status",""].map(h=><th key={h} style={{padding:"8px 10px",textAlign:"left",fontWeight:600,fontSize:11,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>{res.length===0?<tr><td colSpan={11} style={{padding:32,textAlign:"center",color:"#94a3b8"}}>No results found.</td></tr>:res.map(c=>{
            const tour=gt(c.tourCode);
            const ap=customers.filter(x=>x.tourCode===c.tourCode&&x.status==="Active").length;
            const {fare}=calcFare(c,tour,ap);
            const warn=c.passportExpiry&&tour?.departureDate&&(new Date(c.passportExpiry)-new Date(tour.departureDate))/2592000000<6;
            return(<tr key={c.id} style={{borderBottom:"1px solid #f1f5f9"}} onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background=""}>
              <td style={{padding:"8px 10px",fontWeight:600,whiteSpace:"nowrap"}}>{c.title} {c.surname} {c.name}{c.isRegular&&<span style={{marginLeft:4,fontSize:9,background:"#fef3c7",color:"#92400e",padding:"1px 5px",borderRadius:99}}>Regular</span>}</td>
              <td style={{padding:"8px 10px"}}><span style={{background:"#dbeafe",color:"#1d4ed8",padding:"2px 8px",borderRadius:99,fontSize:11,fontWeight:700}}>{c.tourCode}</span></td>
              <td style={{padding:"8px 10px",color:"#475569"}}>{c.contact||"—"}</td>
              <td style={{padding:"8px 10px",color:"#475569",maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.email||"—"}</td>
              <td style={{padding:"8px 10px",fontFamily:"monospace",color:"#475569"}}>{c.passportNo||"—"}</td>
              <td style={{padding:"8px 10px",color:warn?"#dc2626":"#475569",fontWeight:warn?700:400,whiteSpace:"nowrap"}}>{fmtDate(c.passportExpiry)}{warn?" ⚠️":""}</td>
              <td style={{padding:"8px 10px"}}>{c.roomType}</td>
              <td style={{padding:"8px 10px"}}><span style={{fontSize:10,padding:"2px 7px",borderRadius:99,background:c.visaStatus==="Approved"?"#dcfce7":c.visaStatus==="Rejected"?"#fee2e2":"#f1f5f9",color:c.visaStatus==="Approved"?"#166534":c.visaStatus==="Rejected"?"#dc2626":"#64748b"}}>{c.visaStatus}</span></td>
              <td style={{padding:"8px 10px",fontWeight:600}}>{fmt(fare)}</td>
              <td style={{padding:"8px 10px"}}><Badge status={c.status}/></td>
              <td style={{padding:"8px 10px"}}><Btn small onClick={()=>onEdit(c)}>Edit</Btn></td>
            </tr>);
          })}</tbody>
        </table>
      </div>
    </div>
  );
}

// ── CUSTOMER FORM ─────────────────────────────────────────────────────────────
function CustomerForm({initial,tours,customers,onSave,onCancel,saving}){
  const [c,setC]=useState({...EC,...initial});
  const [tab,setTab]=useState("personal");
  const [regQ,setRegQ]=useState(""); const [regR,setRegR]=useState([]);
  const u=(k,v)=>setC(p=>({...p,[k]:v}));
  const regs=[...new Map(customers.filter(x=>x.isRegular&&x.id!==c.id).map(x=>[x.contact||x.passportNo,x])).values()];
  useEffect(()=>{
    if(!regQ.trim()){setRegR([]);return;}
    const s=regQ.toLowerCase();
    setRegR(regs.filter(x=>`${x.surname} ${x.name}`.toLowerCase().includes(s)||x.contact?.includes(s)||x.passportNo?.toLowerCase().includes(s)).slice(0,5));
  },[regQ]);
  const applyReg=src=>{setC(p=>({...p,title:src.title,surname:src.surname,name:src.name,contact:src.contact,email:src.email,address:src.address,emergencyContact:src.emergencyContact,emergencyPhone:src.emergencyPhone,dob:src.dob,passportNo:src.passportNo,nationality:src.nationality,passportIssue:src.passportIssue,passportExpiry:src.passportExpiry,isRegular:true,bookingSource:"Repeat",mealRestriction:src.mealRestriction}));setRegQ("");setRegR([]);};
  const tour=tours.find(t=>t.tourCode===c.tourCode);
  const ap=customers.filter(x=>x.tourCode===c.tourCode&&x.status==="Active"&&x.id!==c.id).length+(c.status==="Active"?1:0);
  const {disc,normal,pkg,fare,paid,balance}=calcFare(c,tour,ap);
  const save=()=>{if(!c.tourCode||!c.surname||!c.name)return alert("Tour Code, Surname and Name required.");onSave({...c,id:c.id||"cust_"+Date.now()});};
  const TABS=[{key:"personal",icon:"👤",label:"Personal"},{key:"preference",icon:"🛏️",label:"Preference"},{key:"extension",icon:"✈️",label:"Extension"},{key:"price",icon:"💰",label:"Price"},{key:"payment",icon:"💳",label:"Payment"},{key:"passport",icon:"📗",label:"Passport"},{key:"flight",icon:"🛫",label:"Flight"},{key:"status",icon:"📋",label:"Status"}];
  return(
    <div style={{display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",gap:3,paddingBottom:12,borderBottom:"1px solid #e2e8f0",marginBottom:16,flexWrap:"wrap"}}>
        {TABS.map(t=><button key={t.key} onClick={()=>setTab(t.key)} style={{padding:"7px 12px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:tab===t.key?"#2563eb":"transparent",color:tab===t.key?"#fff":"#64748b",display:"flex",alignItems:"center",gap:4}}>{t.icon} {t.label}</button>)}
      </div>
      {tab==="personal"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Sec icon="👤" title="Personal Details"/>
        <div style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:9,padding:12}}>
          <div style={{fontSize:11,fontWeight:700,color:"#0369a1",marginBottom:8,textTransform:"uppercase"}}>🔁 Fill from Regular Customer</div>
          <div style={{position:"relative"}}>
            <input value={regQ} onChange={e=>setRegQ(e.target.value)} placeholder="Search by name, contact, or passport no…" style={{width:"100%",padding:"7px 10px",border:"1px solid #bae6fd",borderRadius:7,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
            {regR.length>0&&<div style={{position:"absolute",zIndex:20,top:"100%",left:0,right:0,background:"#fff",border:"1px solid #e2e8f0",borderRadius:8,boxShadow:"0 8px 24px rgba(0,0,0,.12)",marginTop:2}}>
              {regR.map(r=><div key={r.id} onClick={()=>applyReg(r)} style={{padding:"9px 14px",cursor:"pointer",borderBottom:"1px solid #f1f5f9",display:"flex",justifyContent:"space-between",alignItems:"center"}} onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                <div><div style={{fontWeight:700,fontSize:13}}>{r.title} {r.surname} {r.name}</div><div style={{fontSize:11,color:"#94a3b8"}}>{r.contact} · {r.passportNo}</div></div>
                <span style={{fontSize:11,color:"#2563eb",fontWeight:600}}>Use ↗</span>
              </div>)}
            </div>}
          </div>
        </div>
        <G n={3}><Inp label="Title" value={c.title} onChange={v=>u("title",v)} options={TITLES}/><Inp label="Surname" value={c.surname} onChange={v=>u("surname",v)} required/><Inp label="Given Name" value={c.name} onChange={v=>u("name",v)} required/></G>
        <G n={2}><Inp label="Contact No." value={c.contact} onChange={v=>u("contact",v)}/><Inp label="Email" value={c.email} onChange={v=>u("email",v)} type="email"/></G>
        <Inp label="Address" value={c.address} onChange={v=>u("address",v)}/>
        <G n={2}><Inp label="Emergency Contact Name" value={c.emergencyContact} onChange={v=>u("emergencyContact",v)}/><Inp label="Emergency Contact Phone" value={c.emergencyPhone} onChange={v=>u("emergencyPhone",v)}/></G>
        <G n={3}><Inp label="Booking Source" value={c.bookingSource} onChange={v=>u("bookingSource",v)} options={BOOKING_SRC}/><Inp label="Visa Status" value={c.visaStatus} onChange={v=>u("visaStatus",v)} options={VISA_STATUSES}/><div style={{display:"flex",alignItems:"flex-end",paddingBottom:6}}><Chk label="Regular Customer" checked={boolify(c.isRegular)} onChange={v=>u("isRegular",v)}/></div></G>
        <Inp label="Special Needs / Accessibility" value={c.specialNeeds} onChange={v=>u("specialNeeds",v)} placeholder="Wheelchair, medical conditions, etc."/>
      </div>}
      {tab==="preference"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Sec icon="🛏️" title="Personal Preferences"/>
        <G n={3}><Inp label="Room Type" value={c.roomType} onChange={v=>u("roomType",v)} options={ROOM_TYPES}/><Inp label="Room Partner" value={c.roomPartner} onChange={v=>u("roomPartner",v)}/><Inp label="Meal Restriction" value={c.mealRestriction} onChange={v=>u("mealRestriction",v)} options={MEAL_OPTS}/></G>
        <G n={2}><Inp label="Insurance Policy No." value={c.insurancePolicyNo} onChange={v=>u("insurancePolicyNo",v)}/><Inp label="Insurance Coverage (RM)" value={c.insuranceAmount} onChange={v=>u("insuranceAmount",v)} type="number"/></G>
        <Inp label="Internal Notes" value={c.notes} onChange={v=>u("notes",v)} placeholder="Special notes…"/>
      </div>}
      {tab==="extension"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Sec icon="✈️" title="Extensions"/>
        <Inp label="Flight & Hotel Extension" value={c.flightExtension} onChange={v=>u("flightExtension",v)}/>
        <Inp label="Hotel Extension Details" value={c.hotelExtension} onChange={v=>u("hotelExtension",v)}/>
        <Inp label="Other Extensions / Add-ons" value={c.otherExtension} onChange={v=>u("otherExtension",v)}/>
      </div>}
      {tab==="price"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Sec icon="💰" title="Pricing"/>
        <div style={{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:10,padding:14,display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
          {[["Normal Price",fmt(normal),"#0c4a6e"],["Discount","- "+fmt(disc),"#dc2626"],["Package Price",fmt(pkg),"#0c4a6e"],["Tour Fare (Final)",fmt(fare),"#166534"]].map(([l,v,col])=><div key={l}><div style={{fontSize:11,fontWeight:700,color:"#0369a1",textTransform:"uppercase"}}>{l}</div><div style={{fontSize:18,fontWeight:800,color:col,marginTop:2}}>{v}</div></div>)}
        </div>
        <G n={2}><Inp label="Upgrade / Extension Add-on (RM)" value={c.upgradeAmount} onChange={v=>u("upgradeAmount",v)} type="number"/><div style={{display:"flex",alignItems:"flex-end",paddingBottom:6}}><Chk label="Ground Tour Only (deduct flight)" checked={boolify(c.groundTourOnly)} onChange={v=>u("groundTourOnly",v)}/></div></G>
      </div>}
      {tab==="payment"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Sec icon="💳" title="Payment Record"/>
        <G n={3}><Inp label="1st Payment (RM)" value={c.payment1} onChange={v=>u("payment1",v)} type="number"/><Inp label="2nd Payment (RM)" value={c.payment2} onChange={v=>u("payment2",v)} type="number"/><Inp label="3rd Payment (RM)" value={c.payment3} onChange={v=>u("payment3",v)} type="number"/></G>
        <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:14,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
          {[["Total Paid",fmt(paid),"#14532d"],["Tour Fare",fmt(fare),"#14532d"],[balance>0?"Balance to Collect":"Overpaid",fmt(Math.abs(balance)),balance>0?"#dc2626":"#166534"]].map(([l,v,col])=><div key={l}><div style={{fontSize:11,fontWeight:700,color:"#15803d",textTransform:"uppercase"}}>{l}</div><div style={{fontSize:18,fontWeight:800,color:col}}>{v}</div></div>)}
        </div>
      </div>}
      {tab==="passport"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Sec icon="📗" title="Passport & Identity"/>
        <G n={3}>
          <Inp label="Date of Birth" value={c.dob} onChange={v=>u("dob",v)} type="date"/>
          <div style={{display:"flex",flexDirection:"column",gap:3}}><label style={{fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase"}}>Age</label><div style={{padding:"8px 10px",background:"#f8fafc",borderRadius:7,fontSize:13,border:"1px solid #e2e8f0"}}>{c.dob?ageYrs(c.dob)+" years":"—"}</div></div>

        {c.passportExpiry&&tour?.departureDate&&(new Date(c.passportExpiry)-new Date(tour.departureDate))/2592000000<6&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:10,color:"#dc2626",fontSize:12,fontWeight:600}}>⚠️ Passport expires within 6 months of departure date — may be invalid for travel!</div>}

        <G n={2}><Inp label="Flight Price (RM)" value={c.flightPrice} onChange={v=>u("flightPrice",v)} type="number"/><Inp label="Domestic Flight" value={c.domesticFlight} onChange={v=>u("domesticFlight",v)} placeholder="e.g. MH1234 KUL–PEN"/></G>
      </div>}
      {tab==="status"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>

        <G n={2}><Inp label="Tour Code" value={c.tourCode} onChange={v=>u("tourCode",v)} options={tours.map(t=>t.tourCode)} required/><Inp label="Customer Status" value={c.status} onChange={v=>u("status",v)} options={["Active","Transferred","Cancelled"]}/></G>

        {c.status==="Cancelled"&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:14,display:"flex",flexDirection:"column",gap:12}}>
          <Sec icon="❌" title="Cancellation Details"/>
          <Inp label="Cancellation Reason" value={c.cancelReason} onChange={v=>u("cancelReason",v)}/>

          <div style={{display:"flex",gap:20}}><Chk label="Refund Processed" checked={boolify(c.cancelRefundDone)} onChange={v=>u("cancelRefundDone",v)}/><Chk label="Voucher Issued" checked={boolify(c.cancelVoucherIssued)} onChange={v=>u("cancelVoucherIssued",v)}/></div>
        </div>}
      </div>}
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:20,paddingTop:14,borderTop:"1px solid #e2e8f0"}}>
        <Btn onClick={onCancel}>Cancel</Btn>
        <Btn onClick={save} variant="primary" disabled={saving}>{saving?<><Spinner/> Saving…</>:"Save Customer"}</Btn>
      </div>
    </div>
  );
}

// ── TOUR DETAIL ───────────────────────────────────────────────────────────────
function TourDetail({tour,customers,tours,onAdd,onEditCust,onEditTour,onBack}){
  const tc=customers.filter(c=>c.tourCode===tour.tourCode);
  const ap=tc.filter(c=>c.status==="Active").length;
  const disc=boolify(tour.isSpecialDiscount)?Number(tour.specialDiscount||0):getDiscount(ap);
  const today=Number(tour.normalPrice||0)-disc;
  const dn=calcDN(tour.departureDate,tour.arrivalDate);
  const tier=DISCOUNT_TIERS.find(t=>ap>=t.min&&ap<=t.max);
  const totBal=tc.reduce((s,c)=>s+calcFare(c,tour,ap).balance,0);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <Btn onClick={onBack}>← Back</Btn>
        <h2 style={{margin:0,fontSize:18,color:"#1e293b"}}>{tour.tourCode} — {tour.tourName}</h2>
        <Badge status={tour.status}/>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          <Btn onClick={()=>printManifest(tour,tc)} variant="green">🖨️ Print Manifest</Btn>
          <Btn onClick={onEditTour}>✏️ Edit Tour</Btn>
          <Btn onClick={onAdd} variant="primary">+ Add Customer</Btn>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10}}>
        {[{l:"Airline",v:tour.airline||"—"},{l:"Departure",v:fmtDate(tour.departureDate)},{l:"Arrival",v:fmtDate(tour.arrivalDate)},{l:"Duration",v:dn.days>0?`${dn.days}D/${dn.nights}N`:"—"},{l:"Tour Manager",v:tour.tourManager||"—"},{l:"Active Pax",v:`${ap} pax`,hi:"#dbeafe"},{l:"Normal Price",v:fmt(tour.normalPrice)},{l:"Discount",v:fmt(disc),sub:tier?.label},{l:"Price Today",v:fmt(today),hi:"#dcfce7",bold:true},{l:"Single Supp.",v:fmt(tour.singleSupplement)},{l:"Meal Incl.",v:tour.mealIncluded||"—"},{l:"Outstanding",v:fmt(Math.abs(totBal)),sub:totBal<0?"Overpaid":"To collect",hi:totBal>0?"#fef2f2":undefined}].map(({l,v,sub,hi,bold})=>(
          <Card key={l} style={{padding:12,background:hi||"#fff"}}>
            <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",fontWeight:700}}>{l}</div>
            <div style={{fontSize:13,fontWeight:bold?800:700,color:"#1e293b",marginTop:2}}>{v}</div>
            {sub&&<div style={{fontSize:10,color:"#94a3b8",marginTop:1}}>{sub}</div>}
          </Card>
        ))}
      </div>
      <Card>
        <Sec icon="👥" title={`Customers (${tc.length} total · ${ap} active)`}/>
        {tc.length===0?<div style={{textAlign:"center",padding:32,color:"#94a3b8"}}>No customers yet. Click "+ Add Customer" to start.</div>:(
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr style={{background:"#f8fafc"}}>{["#","Name","Contact","Room","Meal","Visa","Passport Exp.","Fare","Paid","Balance","Status",""].map(h=><th key={h} style={{padding:"8px 10px",textAlign:"left",color:"#64748b",fontWeight:700,fontSize:11,borderBottom:"2px solid #e2e8f0",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
              <tbody>{tc.map((c,i)=>{
                const {fare,paid,balance}=calcFare(c,tour,ap);
                const warn=c.passportExpiry&&tour.departureDate&&(new Date(c.passportExpiry)-new Date(tour.departureDate))/2592000000<6;
                return(<tr key={c.id||i} style={{borderBottom:"1px solid #f1f5f9",opacity:c.status!=="Active"?.6:1}} onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                  <td style={{padding:"8px 10px",color:"#94a3b8"}}>{i+1}</td>
                  <td style={{padding:"8px 10px",fontWeight:600,whiteSpace:"nowrap"}}>{c.title} {c.surname} {c.name}{boolify(c.isRegular)&&<span style={{marginLeft:4,fontSize:9,background:"#fef3c7",color:"#92400e",padding:"1px 5px",borderRadius:99}}>Regular</span>}{c.specialNeeds&&<span style={{marginLeft:4,fontSize:9,background:"#fce7f3",color:"#9d174d",padding:"1px 5px",borderRadius:99}}>♿</span>}</td>
                  <td style={{padding:"8px 10px",color:"#475569"}}>{c.contact||"—"}</td>
                  <td style={{padding:"8px 10px",whiteSpace:"nowrap"}}>{c.roomType}{c.roomPartner?" / "+c.roomPartner:""}</td>
                  <td style={{padding:"8px 10px"}}>{c.mealRestriction!=="None"?c.mealRestriction:"—"}</td>
                  <td style={{padding:"8px 10px"}}><span style={{fontSize:10,padding:"2px 7px",borderRadius:99,background:c.visaStatus==="Approved"?"#dcfce7":c.visaStatus==="Rejected"?"#fee2e2":"#f1f5f9",color:c.visaStatus==="Approved"?"#166534":c.visaStatus==="Rejected"?"#dc2626":"#64748b"}}>{c.visaStatus}</span></td>
                  <td style={{padding:"8px 10px",color:warn?"#dc2626":"#475569",fontWeight:warn?700:400,whiteSpace:"nowrap"}}>{fmtDate(c.passportExpiry)}{warn?" ⚠️":""}</td>
                  <td style={{padding:"8px 10px",fontWeight:600}}>{fmt(fare)}</td>
                  <td style={{padding:"8px 10px",color:"#22c55e",fontWeight:600}}>{fmt(paid)}</td>
                  <td style={{padding:"8px 10px",fontWeight:700,color:balance>0?"#dc2626":"#22c55e",whiteSpace:"nowrap"}}>{fmt(Math.abs(balance))}{balance<0?" CR":""}</td>
                  <td style={{padding:"8px 10px"}}><Badge status={c.status}/></td>
                  <td style={{padding:"8px 10px"}}><Btn small onClick={()=>onEditCust(c)}>Edit</Btn></td>
                </tr>);
              })}</tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const [signedIn,   setSI]  = useState(false);
  const [tours,      setT]   = useState([]);
  const [customers,  setC]   = useState([]);
  const [syncState,  setSS]  = useState("idle");
  const [lastSync,   setLS]  = useState(null);
  const [syncError,  setSE]  = useState(null);
  const [view,       setV]   = useState("dashboard");
  const [selTour,    setSTr] = useState(null);
  const [editTour,   setET]  = useState(null);
  const [editCust,   setEC]  = useState(null);
  const [saving,     setSav] = useState(false);
  const [searchQ,    setSQ]  = useState("");
  const [statFilt,   setSF]  = useState("All");
  const [showCS,     setSCS] = useState(false);
  const [refreshing, setRef] = useState(false);

  const loadFromSheets=useCallback(async()=>{
    setSS("loading");setSE(null);
    try{
      await ensureSheetTabs();
      const [t,c]=await Promise.all([getSheetRows(SHEETS.TOURS,TOUR_COLS),getSheetRows(SHEETS.CUSTOMERS,CUST_COLS)]);
      setT(t);setC(c);setSS("saved");setLS(Date.now());
    }catch(e){setSS("error");setSE(e.message);}
  },[]);

  const handleSignIn=async(token)=>{_token=token;setSI(true);await loadFromSheets();};

  const saveTour=async(t)=>{
    setSav(true);setSS("saving");
    try{
      const idx=tours.findIndex(x=>x.id===t.id);
      const newT=idx>=0?[...tours.slice(0,idx),t,...tours.slice(idx+1)]:[...tours,t];
      await writeAllRows(SHEETS.TOURS,TOUR_COLS,newT);
      setT(newT);setSS("saved");setLS(Date.now());
      setV(selTour?"tourDetail":"dashboard");if(!selTour)setSTr(t);
    }catch(e){setSS("error");setSE(e.message);}
    setSav(false);
  };

  const saveCust=async(c)=>{
    setSav(true);setSS("saving");
    try{
      const idx=customers.findIndex(x=>x.id===c.id);
      const newC=idx>=0?[...customers.slice(0,idx),c,...customers.slice(idx+1)]:[...customers,c];
      await writeAllRows(SHEETS.CUSTOMERS,CUST_COLS,newC);
      setC(newC);setSS("saved");setLS(Date.now());
      setSCS(false);setV("tourDetail");
    }catch(e){setSS("error");setSE(e.message);}
    setSav(false);
  };

  const refresh=async()=>{setRef(true);await loadFromSheets();setRef(false);};

  const filtered=tours.filter(t=>{
    const q=searchQ.toLowerCase();
    return(!q||t.tourCode.toLowerCase().includes(q)||t.tourName.toLowerCase().includes(q)||(t.tourManager||"").toLowerCase().includes(q))
      &&(statFilt==="All"||t.status===statFilt);
  });

  const Modal=({title,children,onClose,wide})=>(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"24px 16px",overflowY:"auto"}}>
      <div style={{background:"#fff",borderRadius:16,width:`min(${wide?"1100px":"900px"},98vw)`,boxShadow:"0 24px 60px rgba(0,0,0,.3)"}}>
        <div style={{padding:"16px 24px",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:"#fff",zIndex:10,borderRadius:"16px 16px 0 0"}}>
          <span style={{fontWeight:700,fontSize:16,color:"#1e293b"}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#94a3b8",lineHeight:1}}>×</button>
        </div>
        <div style={{padding:24}}>{children}</div>
      </div>
    </div>
  );

  if(!signedIn)return <SignInScreen onSignIn={handleSignIn}/>;

  const currentTour=selTour?(tours.find(t=>t.tourCode===selTour.tourCode)||selTour):null;

  return(
    <div style={{minHeight:"100vh",background:"#f1f5f9"}}>
      {/* NAV */}
      <div style={{background:"#0f172a",color:"#fff",padding:"0 24px",display:"flex",alignItems:"center",gap:12,height:58,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.3)"}}>
        <span style={{fontSize:22}}>✈️</span>
        <span style={{fontWeight:800,fontSize:15,letterSpacing:-.3}}>Tour Ops</span>
        <span style={{color:"#334155",fontSize:13,display:"none"}}>Management System</span>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          <Btn onClick={refresh} variant="ghost" small disabled={refreshing}>{refreshing?<><Spinner/> Refreshing…</>:"🔄 Refresh"}</Btn>
          <Btn onClick={()=>setSCS(true)} small>🔍 Customer Search</Btn>
          {view!=="dashboard"&&<Btn onClick={()=>{setV("dashboard");setSTr(null);}} small>📊 Dashboard</Btn>}
          <Btn onClick={()=>{setET(null);setV("tourForm");}} variant="primary" small>+ New Tour</Btn>
          <Btn onClick={()=>signOut(()=>setSI(false))} variant="ghost" small>Sign Out</Btn>
        </div>
      </div>
      <SyncBar state={syncState} lastSync={lastSync} error={syncError} onRetry={loadFromSheets}/>

      <div style={{padding:24,maxWidth:1440,margin:"0 auto"}}>
        {/* DASHBOARD */}
        {view==="dashboard"&&(
          <div style={{display:"flex",flexDirection:"column",gap:18}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
              {[{l:"Total Tours",v:tours.length,icon:"🗺️",c:"#dbeafe"},{l:"Active / Departed",v:tours.filter(t=>t.status==="Confirmed"||t.status==="Departed").length,icon:"✅",c:"#dcfce7"},{l:"Active Customers",v:customers.filter(c=>c.status==="Active").length,icon:"👥",c:"#f3e8ff"},{l:"Cancellations",v:customers.filter(c=>c.status==="Cancelled").length,icon:"❌",c:"#fee2e2"}].map(s=>(
                <Card key={s.l} style={{display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:44,height:44,borderRadius:10,background:s.c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{s.icon}</div>
                  <div><div style={{fontSize:11,color:"#64748b",fontWeight:700,textTransform:"uppercase"}}>{s.l}</div><div style={{fontSize:26,fontWeight:800,color:"#1e293b"}}>{s.v}</div></div>
                </Card>
              ))}
            </div>
            <div style={{display:"flex",gap:10}}>
              <div style={{position:"relative",flex:1}}><span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#94a3b8"}}>🔍</span><input value={searchQ} onChange={e=>setSQ(e.target.value)} placeholder="Search by tour code, name, or manager…" style={{width:"100%",padding:"9px 12px 9px 36px",borderRadius:9,border:"1px solid #d1d5db",fontSize:13,outline:"none",boxSizing:"border-box"}}/></div>
              <select value={statFilt} onChange={e=>setSF(e.target.value)} style={{padding:"9px 12px",borderRadius:9,border:"1px solid #d1d5db",fontSize:13,background:"#fff"}}><option value="All">All Status</option>{TOUR_STATUSES.map(s=><option key={s}>{s}</option>)}</select>
            </div>
            <Card>
              <Sec icon="🗺️" title={`Tour List (${filtered.length})`}/>
              {filtered.length===0?<div style={{textAlign:"center",padding:40,color:"#94a3b8"}}>{tours.length===0?"No tours yet. Click \"+ New Tour\" to begin.":"No tours match."}</div>:(
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead><tr style={{background:"#f8fafc"}}>{["Tour Code","Tour Name","Airline","Departure","Arrival","Days/Nights","Pax","Normal Price","Discount","Price Today","Single Supp.","Meals In","Meals Out","Manager","Status",""].map(h=><th key={h} style={{padding:"9px 10px",textAlign:"left",color:"#64748b",fontWeight:700,fontSize:11,borderBottom:"2px solid #e2e8f0",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
                    <tbody>{filtered.map(t=>{
                      const pax=customers.filter(c=>c.tourCode===t.tourCode&&c.status==="Active").length;
                      const disc=boolify(t.isSpecialDiscount)?Number(t.specialDiscount||0):getDiscount(pax);
                      const today=Number(t.normalPrice||0)-disc;
                      const dn=calcDN(t.departureDate,t.arrivalDate);
                      return(<tr key={t.id} style={{borderBottom:"1px solid #f1f5f9",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                        <td style={{padding:"9px 10px",fontWeight:700,color:"#2563eb"}} onClick={()=>{setSTr(t);setV("tourDetail");}}>{t.tourCode}</td>
                        <td style={{padding:"9px 10px",fontWeight:600,color:"#1e293b"}}>{t.tourName}</td>
                        <td style={{padding:"9px 10px",color:"#475569"}}>{t.airline||"—"}</td>
                        <td style={{padding:"9px 10px",color:"#475569",whiteSpace:"nowrap"}}>{fmtDate(t.departureDate)}</td>
                        <td style={{padding:"9px 10px",color:"#475569",whiteSpace:"nowrap"}}>{fmtDate(t.arrivalDate)}</td>
                        <td style={{padding:"9px 10px",color:"#475569"}}>{dn.days>0?`${dn.days}D/${dn.nights}N`:"—"}</td>
                        <td style={{padding:"9px 10px",textAlign:"center"}}><span style={{background:"#dbeafe",color:"#1d4ed8",padding:"2px 10px",borderRadius:99,fontWeight:700}}>{pax}</span></td>
                        <td style={{padding:"9px 10px",color:"#475569"}}>{fmt(t.normalPrice)}</td>
                        <td style={{padding:"9px 10px",color:"#dc2626",fontWeight:600}}>- {fmt(disc)}</td>
                        <td style={{padding:"9px 10px",fontWeight:800,color:"#166534"}}>{fmt(today)}</td>
                        <td style={{padding:"9px 10px",color:"#475569"}}>{fmt(t.singleSupplement)}</td>
                        <td style={{padding:"9px 10px",color:"#475569",fontSize:11,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.mealIncluded||"—"}</td>
                        <td style={{padding:"9px 10px",color:"#475569",fontSize:11,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.mealExcluded||"—"}</td>
                        <td style={{padding:"9px 10px",color:"#475569"}}>{t.tourManager||"—"}</td>
                        <td style={{padding:"9px 10px"}}><Badge status={t.status}/></td>
                        <td style={{padding:"9px 10px"}}>
                          <div style={{display:"flex",gap:4}}>
                            <Btn small onClick={()=>{setSTr(t);setV("tourDetail");}}>View</Btn>
                            <Btn small onClick={()=>{setET(t);setV("tourForm");}}>✏️</Btn>
                          </div>
                        </td>
                      </tr>);
                    })}</tbody>
                  </table>
                </div>
              )}
            </Card>
            <Card style={{background:"#fffbeb",border:"1px solid #fde68a"}}>
              <Sec icon="💡" title="Auto-Discount Tier Reference"/>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {DISCOUNT_TIERS.filter(t=>t.discount>0).map(t=><div key={t.label} style={{background:"#fff",border:"1px solid #fde68a",borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700}}>{t.label}</div>)}
                <div style={{background:"#fff",border:"1px dashed #d1d5db",borderRadius:8,padding:"8px 14px",fontSize:12,color:"#94a3b8"}}>Special departures can override any tier</div>
              </div>
            </Card>
          </div>
        )}

        {view==="tourDetail"&&currentTour&&<TourDetail tour={currentTour} customers={customers} tours={tours} onBack={()=>{setV("dashboard");setSTr(null);}} onEditTour={()=>{setET(currentTour);setV("tourForm");}} onAdd={()=>{setEC({...EC,tourCode:currentTour.tourCode});setV("customerForm");}} onEditCust={c=>{setEC(c);setV("customerForm");}}/>}

        {view==="tourForm"&&<Modal title={editTour?"Edit Tour":"New Tour"} onClose={()=>setV(selTour?"tourDetail":"dashboard")}><TourForm initial={editTour||{}} onSave={saveTour} onCancel={()=>setV(selTour?"tourDetail":"dashboard")} saving={saving}/></Modal>}
        {view==="customerForm"&&<Modal title={editCust?.id?"Edit Customer":"Add Customer"} onClose={()=>setV("tourDetail")} wide><CustomerForm initial={editCust||{}} tours={tours} customers={customers} onSave={saveCust} onCancel={()=>setV("tourDetail")} saving={saving}/></Modal>}
        {showCS&&<Modal title="🔍 Customer Search — All Tours" onClose={()=>setSCS(false)} wide><CustomerSearch customers={customers} tours={tours} onEdit={c=>{setEC(c);const t=tours.find(x=>x.tourCode===c.tourCode);setSTr(t||null);setSCS(false);setV("customerForm");}}/></Modal>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
