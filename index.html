<title>✈️ Tour Ops — Management System</title>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue-lt:#eff6ff;--blue-bd:#bfdbfe;
  --green:#16a34a;--green-lt:#f0fdf4;--green-bd:#bbf7d0;
  --red:#dc2626;--red-lt:#fef2f2;--red-bd:#fecaca;
  --orange:#ea580c;--orange-lt:#fff7ed;--orange-bd:#fed7aa;
  --purple:#7c3aed;--purple-lt:#f5f3ff;--purple-bd:#ddd6fe;
  --yellow-lt:#fefce8;--yellow-bd:#fde68a;--yellow:#ca8a04;

  --slate-500:#64748b;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;

}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--slate-100);color:var(--slate-800);font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:13px}
input,select,textarea{width:100%;border:1.5px solid var(--slate-300);border-radius:8px;padding:8px 11px;background:#fff;color:var(--slate-800);transition:var(--transition);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
input:disabled,select:disabled{background:var(--slate-50);color:var(--slate-500);cursor:not-allowed}
textarea{min-height:68px;resize:vertical}
label{font-size:10px;text-transform:uppercase;color:var(--slate-500);font-weight:800;letter-spacing:.06em;display:block;margin-bottom:4px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:99px}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;flex-shrink:0;background:var(--slate-900);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-icon{font-size:26px;margin-bottom:3px}
.sidebar-logo h1{font-size:15px;font-weight:900;color:#fff;letter-spacing:-.3px}
.sidebar-logo p{font-size:10px;color:#64748b;margin-top:1px}
.sidebar-nav{padding:8px;flex:1}
.sidebar-section{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#475569;font-weight:800;padding:14px 8px 5px}
.side-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:none;background:transparent;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;text-align:left;transition:var(--transition);margin-bottom:1px}
.side-btn:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.side-btn.active{background:rgba(37,99,235,.35);color:#93c5fd}
.side-icon{font-size:14px;flex-shrink:0}
.side-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-badge{flex-shrink:0;padding:1px 6px;border-radius:99px;font-size:10px;font-weight:800}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* TOPBAR */
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--slate-200);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:30;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.topbar-title{font-weight:800;font-size:15px;color:var(--slate-800)}
.topbar-sub{font-size:11px;color:var(--slate-500);margin-top:1px}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sync-dot.idle,.sync-dot.saved{background:#22c55e}
.sync-dot.loading,.sync-dot.saving{background:#f59e0b;animation:blink 1s infinite}
.sync-dot.error{background:#dc2626}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.content{padding:20px;flex:1;overflow:auto;max-height:calc(100vh - 54px)}

/* CARDS */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)}
.card-flat{background:var(--slate-50);border:1px solid var(--slate-200);border-radius:var(--radius);padding:14px}

/* BUTTONS */
.btn{border:1.5px solid var(--slate-300);background:#fff;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:var(--transition);white-space:nowrap;color:var(--slate-700);line-height:1.4}
.btn:hover:not(:disabled){border-color:var(--slate-400);background:var(--slate-50)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8}
.btn.green{border-color:var(--green);background:var(--green);color:#fff}
.btn.green:hover:not(:disabled){background:#15803d}
.btn.danger{border-color:var(--red);background:var(--red);color:#fff}
.btn.danger:hover:not(:disabled){background:#b91c1c}
.btn.ghost{border:none;background:transparent;color:var(--slate-500)}
.btn.ghost:hover:not(:disabled){background:var(--slate-100);color:var(--slate-700)}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.lg{padding:11px 22px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* GRID */
.grid{display:grid;gap:12px}

/* BADGES */
.badge{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:3px}

/* TABLES */
.table-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--slate-200)}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{position:sticky;top:0;background:var(--slate-800);color:#fff;z-index:1;padding:9px 10px;text-align:left;font-size:11px;font-weight:700;white-space:nowrap}
.table td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.table tbody tr:hover td{background:#f8fafc!important}
.table tbody tr:last-child td{border-bottom:none}
.bday-row td{background:#fefce8!important}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--slate-100);padding:3px;border-radius:10px;flex-wrap:wrap}
.tab{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-weight:700;color:var(--slate-500);cursor:pointer;font-size:12px;transition:var(--transition)}
.tab:hover{color:var(--slate-700)}
.tab.active{background:#fff;color:var(--slate-800);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* SECTION TITLE */
.section-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--slate-800);margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--slate-100)}
.section-title .icon{font-size:17px}

/* STAT BOXES */
.stat-box{background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius);padding:12px 14px;transition:var(--transition)}
.stat-box:hover{border-color:var(--slate-300)}
.stat-label{font-size:10px;text-transform:uppercase;color:var(--slate-500);font-weight:800;letter-spacing:.05em;margin-bottom:5px}
.stat-value{font-size:20px;font-weight:900;color:var(--slate-800);line-height:1.1}
.stat-sub{font-size:11px;color:var(--slate-500);margin-top:3px}

/* MONO FLIGHT */
.flight-line{font-size:12px;padding:6px 10px;background:var(--slate-800);color:#e2e8f0;border-radius:6px;margin-bottom:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em}

/* NOTICES */
.notice{padding:10px 13px;border-radius:var(--radius);font-size:12px;line-height:1.6}
.notice.info{background:var(--blue-lt);border:1px solid var(--blue-bd);color:#1e40af}
.notice.warn{background:var(--yellow-lt);border:1px solid var(--yellow-bd);color:#713f12}
.notice.success{background:var(--green-lt);border:1px solid var(--green-bd);color:#14532d}
.notice.danger{background:var(--red-lt);border:1px solid var(--red-bd);color:#7f1d1d}

/* SEARCH */
.search-bar{position:relative}
.search-bar input{padding-left:34px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--slate-400);font-size:14px;pointer-events:none}

/* MODAL */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:50;overflow:auto;padding:20px 12px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:var(--radius-lg);max-width:1100px;margin:0 auto;box-shadow:0 24px 80px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--slate-200);position:sticky;top:0;background:#fff;z-index:2;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-body{padding:20px}

/* PROGRESS */
.progress-bar{height:6px;background:var(--slate-200);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .3s}

/* EMPTY */
.empty-state{text-align:center;padding:40px 20px;color:var(--slate-400)}
.empty-icon{font-size:36px;margin-bottom:10px}

/* PENDING ITEM */
.pending-item{padding:5px 8px 5px 10px;border-left:3px solid var(--red);font-size:11px;color:var(--red);font-weight:700;margin-bottom:2px;background:var(--red-lt);border-radius:0 6px 6px 0}

/* PRINT */
@media print{.no-print{display:none!important}.print-only{display:block!important}body{background:#fff}.card{box-shadow:none}}
.print-only{display:none}

/* FIELD */
.field-wrap{display:flex;flex-direction:column;gap:0}
.field-hint{font-size:10px;color:var(--slate-400);margin-top:3px}
.sideBtn{display:block;width:100%;text-align:left;padding:7px 10px;border:none;background:transparent;border-radius:7px;cursor:pointer;font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:2px}
.sideBtn:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.sideBtn.active{background:rgba(37,99,235,.35);color:#93c5fd}
</style>

      h('h1',{style:{fontSize:24,fontWeight:900,marginBottom:4}},'Tour Ops System'),
      h('p',{style:{color:'#64748b',margin:'8px 0 28px',fontSize:13,lineHeight:1.7}},'Tour, customer, flight, voucher, payment & task tracking.',h('br',null),'All data stays in your Google Sheet.'),
      h('button',{className:'btn primary lg',disabled:busy,onClick:async()=>{setBusy(true);setErr('');try{await signIn(onSignIn)}catch(e){setErr(e.message)}setBusy(false)},style:{width:'100%',justifyContent:'center'}},busy?'Connecting…':'🔑 Sign in with Google'),
      err&&h('div',{className:'notice danger',style:{marginTop:14,textAlign:'left'}},err),
      h('div',{className:'notice info',style:{marginTop:16,textAlign:'left',fontSize:12}},h('b',null,'Setup reminder: '),h('br',null),'Add ',h('code',null,'https://jingwei-ee.github.io'),' as an Authorised JavaScript Origin in Google Cloud Console.')
    )
  );
}

function App(){
  const [signed,setSigned]=useState(false);
  const [tours,setTours]=useState([]);
  const [customers,setCustomers]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [vouchers,setVouchers]=useState([]);
  const [sync,setSync]=useState('idle');
  const [view,setView]=useState('dashboard');
  const [sel,setSel]=useState(null);
  const [editTour,setEditTour]=useState(null);
  const [editCust,setEditCust]=useState(null);
  const [saving,setSaving]=useState(false);

  const load=useCallback(async()=>{
    setSync('loading');
    try{
      await ensureTabs();
      const [t,c,tk,v]=await Promise.all([getRows(SHEETS.TOURS,TOUR_COLS),getRows(SHEETS.CUSTOMERS,CUST_COLS),getRows(SHEETS.TASKS,TASK_COLS),getRows(SHEETS.VOUCHERS,VOUCHER_COLS)]);
      setTours(t);setCustomers(c);setTasks(tk);setVouchers(maybeSeedVouchers(v));
      setSync('saved');
    }catch(e){setSync('error');console.error(e);}
  },[]);

  async function saveTour(t){
    setSaving(true);setSync('saving');
    try{
      const pax=activePax(customers,t.tourCode);
      const final={...t,id:t.id||'tour_'+Date.now(),status:(!boolify(t.isSpecialDiscount)&&pax>=18&&!['Cancelled','Departed','Completed'].includes(t.status))?'Confirmed':t.status};
      const arr=tours.some(x=>x.id===final.id)?tours.map(x=>x.id===final.id?final:x):[...tours,final];
      await writeRows(SHEETS.TOURS,TOUR_COLS,arr);setTours(arr);
      setSync('saved');setView(sel?'tour':'dashboard');if(!sel)setSel(final);
    }catch(e){setSync('error');alert('Save failed: '+e.message);}
    setSaving(false);
  }

  async function saveCust(c){
    setSaving(true);setSync('saving');
    try{
      const tour=tours.find(t=>t.tourCode===c.tourCode)||ET;
      const final={...c,id:c.id||'cust_'+Date.now(),surname:String(c.surname||'').toUpperCase(),name:String(c.name||'').toUpperCase()};
      const arr=customers.some(x=>x.id===final.id)?customers.map(x=>x.id===final.id?final:x):[...customers,final];
      const newItems=pendingTasks(final,tour,arr).map(txt=>makeTask(final.tourCode,final.id,txt,'Auto'));
      const newTasks=addMissingTasks(tasks,newItems);
      if(newTasks.length!==tasks.length){await writeRows(SHEETS.TASKS,TASK_COLS,newTasks);setTasks(newTasks);}
      const newPax=activePax(arr,final.tourCode);
      if(newPax>=18&&tour.status==='Pending'){const ut={...tour,status:'Confirmed'};const ta=tours.map(t=>t.id===ut.id?ut:t);await writeRows(SHEETS.TOURS,TOUR_COLS,ta);setTours(ta);}
      await writeRows(SHEETS.CUSTOMERS,CUST_COLS,arr);setCustomers(arr);
      setSync('saved');setView('tour');
    }catch(e){setSync('error');alert('Save failed: '+e.message);}
    setSaving(false);
  }

  async function saveTask(t){
    const arr=tasks.some(x=>x.id===t.id)?tasks.map(x=>x.id===t.id?{...t,updatedAt:new Date().toISOString()}:x):[...tasks,t];
    await writeRows(SHEETS.TASKS,TASK_COLS,arr);setTasks(arr);
  }

  async function saveVouchers(rows){await writeRows(SHEETS.VOUCHERS,VOUCHER_COLS,rows);setVouchers(rows);}

  const pendingCount=(tasks||[]).filter(t=>t.status!=='Done').length;
  const current=sel?(tours.find(t=>t.tourCode===sel.tourCode)||sel):null;

  if(!signed)return h(SignIn,{onSignIn:async tok=>{_token=tok;setSigned(true);await load()}});

  const viewTitle={dashboard:'Dashboard',customerDb:'Customer Database',vouchers:'Voucher Sheet',tasks:'Notifications',tour:current?current.tourCode+' — '+current.tourName:'Tour Detail',tourForm:editTour?'Edit Tour':'New Tour',custForm:editCust&&editCust.id?'Edit Customer':'Add Customer'};

  return h('div',{className:'layout'},
    // SIDEBAR
    h('aside',{className:'sidebar no-print'},
      h('div',{className:'sidebar-logo'},h('div',{className:'logo-icon'},'✈️'),h('h1',null,'Tour Ops'),h('p',null,'Management System')),
      h('div',{className:'sidebar-nav'},
        h('button',{className:'side-btn',onClick:()=>{setEditTour(null);setView('tourForm');}},h('span',{className:'side-icon'},'➕'),h('span',{className:'side-label'},'New Tour')),
        h('div',{className:'sidebar-section'},'Navigation'),
        h('button',{className:'side-btn '+(view==='dashboard'?'active':''),onClick:()=>setView('dashboard')},h('span',{className:'side-icon'},'📊'),h('span',{className:'side-label'},'Dashboard')),
        h('button',{className:'side-btn '+(view==='customerDb'?'active':''),onClick:()=>setView('customerDb')},h('span',{className:'side-icon'},'📋'),h('span',{className:'side-label'},'Customer Database')),
        h('button',{className:'side-btn '+(view==='vouchers'?'active':''),onClick:()=>setView('vouchers')},h('span',{className:'side-icon'},'🎟️'),h('span',{className:'side-label'},'Voucher Sheet')),
        h('button',{className:'side-btn '+(view==='tasks'?'active':''),onClick:()=>setView('tasks')},
          h('span',{className:'side-icon'},'🔔'),h('span',{className:'side-label'},'Notifications'),
          pendingCount>0&&h('span',{className:'side-badge',style:{background:'#dc2626',color:'#fff'}},pendingCount)
        ),
        h('div',{className:'sidebar-section'},'Tours'),
        tours.length===0?h('div',{style:{fontSize:11,color:'#475569',padding:'4px 8px'}},'No tours yet.'):
        [...tours].sort((a,b)=>{const o={Confirmed:0,Pending:1,Departed:2,Completed:3,Cancelled:4};return (o[a.status]??5)-(o[b.status]??5)||(a.departureDate||'').localeCompare(b.departureDate||'');}).map(t=>{
          const pax=activePax(customers,t.tourCode),pc=paxColor(pax);
          const isCur=current&&current.tourCode===t.tourCode;
          return h('button',{key:t.id||t.tourCode,className:'side-btn '+(isCur?'active':''),onClick:()=>{setSel(t);setView('tour');}},
            h('div',{style:{flex:1,overflow:'hidden',textAlign:'left'}},
              h('div',{style:{fontWeight:800,fontSize:12,color:isCur?'#93c5fd':'#e2e8f0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},t.tourCode),
              h('div',{style:{fontSize:10,color:'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},t.tourName||'—')
            ),
            h('span',{className:'badge',style:{background:pc.bg,color:pc.col,fontSize:10,flexShrink:0}},pax)
          );
        })
      )
    ),
    // MAIN AREA
    h('div',{className:'main'},
      // TOP BAR
      h('div',{className:'topbar no-print'},
        h('div',null,
          h('div',{className:'topbar-title'},viewTitle[view]||'Tour Ops'),
          view==='tour'&&current&&h('div',{className:'topbar-sub'},current.tourName+(current.tourManager?' · '+current.tourManager:''))
        ),
        h('div',{style:{marginLeft:'auto',display:'flex',alignItems:'center',gap:10}},
          h('div',{style:{display:'flex',alignItems:'center',gap:6}},
            h('div',{className:'sync-dot '+sync}),
            h('span',{style:{fontSize:11,color:'#94a3b8',fontWeight:600}},{idle:'Synced',loading:'Loading…',saving:'Saving…',saved:'Saved',error:'Error!'}[sync]||'—')
          ),
          h('button',{className:'btn sm ghost',onClick:load},'🔄 Refresh'),
          current&&view!=='tour'&&h('button',{className:'btn sm',onClick:()=>setView('tour')},'📍 '+current.tourCode),
          h('button',{className:'btn sm ghost',onClick:()=>{_token=null;setSigned(false);setTours([]);setCustomers([]);setTasks([]);setVouchers([]);}},'Sign Out')
        )
      ),
      // CONTENT
      h('div',{className:'content'},
        view==='dashboard'&&h(Dashboard,{tours,customers,tasks,onOpen:t=>{setSel(t);setView('tour');},onEdit:t=>{setEditTour(t);setView('tourForm');}}),
        view==='customerDb'&&h(CustomerDatabase,{customers,onBack:()=>setView('dashboard'),onEdit:c=>{setEditCust(c);setView('custForm');}}),
        view==='vouchers'&&h(VoucherLibrary,{vouchers,onSave:saveVouchers,onBack:()=>setView('dashboard')}),
        view==='tasks'&&h('div',{style:{display:'flex',flexDirection:'column',gap:16}},
          h('div',{style:{display:'flex',alignItems:'center',gap:10}},
            h('h2',{style:{fontWeight:800,fontSize:18,flex:1}},'🔔 All Notifications & Pending Actions'),
            h('button',{className:'btn',onClick:()=>setView('dashboard')},'← Dashboard')
          ),
          h(DashboardNotificationWall,{tasks,tours,customers,onOpen:t=>{setSel(t);setView('tour');}})
        ),
        view==='tour'&&current&&h(TourDetail,{tour:current,customers,tasks,onBack:()=>setView('dashboard'),onEditTour:()=>{setEditTour(current);setView('tourForm');},onAddCust:()=>{setEditCust({...EC,tourCode:current.tourCode});setView('custForm');},onEditCust:c=>{setEditCust(c);setView('custForm');},onAddTask:saveTask,onUpdateTask:saveTask}),
        view==='tourForm'&&h(Modal,{title:editTour?'Edit Tour':'New Tour',onClose:()=>setView(current?'tour':'dashboard')},
          h(TourForm,{initial:editTour||{},customers,onSave:saveTour,onCancel:()=>setView(current?'tour':'dashboard'),saving})
        ),
        view==='custForm'&&h(Modal,{title:editCust&&editCust.id?'Edit Customer':'Add Customer',onClose:()=>setView('tour')},
          h(CustomerForm,{initial:editCust||{},tours,customers,onSave:saveCust,onCancel:()=>setView('tour'),saving})
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
