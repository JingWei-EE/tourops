function calcDN(dep,arr){if(!dep||!arr)return{days:0,nights:0};const total=Math.round((new Date(arr)-new Date(dep))/86400000)+1;return{days:total,nights:Math.max(0,total-2)}}

function hashColor(str,sat=1){if(!str)return null;let hsh=0;for(let i=0;i<str.length;i++)hsh=(hsh*31+str.charCodeAt(i))|0;const c=PALETTE[Math.abs(hsh)%PALETTE.length];return sat===1?c:hexMix(c,"#ffffff",sat)}

function hexMix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const ar=pa>>16&255,ag=pa>>8&255,ab=pa&255,br=pb>>16&255,bg=pb>>8&255,bb=pb&255;const r=Math.round(ar*t+br*(1-t)),g=Math.round(ag*t+bg*(1-t)),bl=Math.round(ab*t+bb*(1-t));return"#"+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1)}
function rowToObj(headers,row,cols){const o={};(cols||headers).forEach(k=>o[k]="");headers.forEach((h,i)=>{o[h]=row[i]??""});return o}
function objToRow(headers,obj){return headers.map(h=>{const v=obj[h];if(v===true)return"TRUE";if(v===false)return"FALSE";return v??""})}
function parseVoucher(s){try{return JSON.parse(s||"[]")||[]}catch{return[]}}
function birthdayInTour(dob,dep,arr){if(!dob||!dep||!arr)return false;const d=new Date(dob), start=new Date(dep), end=new Date(arr);const y=start.getFullYear();let b=new Date(y,d.getMonth(),d.getDate());if(b<start&&end.getFullYear()>y)b=new Date(end.getFullYear(),d.getMonth(),d.getDate());return b>=start&&b<=end}
function birthdayVoucher(c,tour){if(!birthdayInTour(c.dob,tour.departureDate,tour.arrivalDate))return null;const y=new Date(tour.departureDate).getFullYear();const d=new Date(c.dob);const from=new Date(y,d.getMonth(),d.getDate());const to=new Date(y+1,d.getMonth(),d.getDate());return{type:"Birthday Discount Voucher",amount:500,expiry:to.toISOString().slice(0,10),validFrom:from.toISOString().slice(0,10),used:false,note:"Auto birthday voucher - 1 year validity"}}
function voucherTotal(c,tour){let arr=parseVoucher(c.voucherJson).filter(v=>!boolify(v.used));const bv=birthdayVoucher(c,tour);if(bv)arr=[...arr,bv];return arr.reduce((s,v)=>s+Number(v.amount||0),0)}
function activePax(customers,tourCode){return customers.filter(c=>c.tourCode===tourCode&&c.status==="Active").length}
function groupSeatUsed(customers,tourCode){return customers.filter(c=>c.tourCode===tourCode&&c.status==="Active"&&!boolify(c.noIntlFlight)&&!boolify(c.differentPNR)).length}
function calcFare(c,tour,customers){const pax=activePax(customers,tour.tourCode);const normal=Number(tour.normalPrice||0);const tier=boolify(tour.isSpecialDiscount)?Number(tour.specialDiscount||0):getDiscount(pax);const vouchers=voucherTotal(c,tour);const cash=Number(c.cashVoucherUsed||0)+Number(c.travelCreditUsed||0);const noFlight=boolify(c.noIntlFlight)?Number(tour.noIntlDeductAmount||0):0;const upg=Number(c.upgradeAmount||0);const fare=normal-tier-vouchers-cash-noFlight+upg;const paid=Number(c.payment1||0)+Number(c.payment2||0)+Number(c.payment3||0);return{normal,tier,vouchers,cash,noFlight,upg,fare,paid,balance:fare-paid}}

function airlineTransit(airline){const a=(airline||"").toUpperCase();if(a.includes("EMIRATES")||a==="EK"||a.startsWith("EK"))return{code:"EK",hub:"DXB"};if(a.includes("QATAR")||a==="QR"||a.startsWith("QR"))return{code:"QR",hub:"DOH"};if(a.includes("TURKISH")||a==="TK"||a.startsWith("TK"))return{code:"TK",hub:"IST"};return{code:"",hub:""}}
function dateToDDMMM(d){if(!d)return"";const x=new Date(d);if(isNaN(x))return"";return String(x.getDate()).padStart(2,"0")+["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][x.getMonth()]}

function pendingTasks(c,tour,customers){
  const out=[];
  const f=calcFare(c,tour,customers);
  if(c.status==="Active"&&!Number(c.payment1||0))out.push("Collect 1st payment after signup");
  if(c.status==="Active"&&tour.status==="Confirmed"&&!Number(c.payment2||0))out.push("Collect 2nd payment after tour confirmed");
  const daysToDep=tour.departureDate?Math.ceil((new Date(tour.departureDate)-new Date())/86400000):999;
  if(c.status==="Active"&&f.balance>0&&(daysToDep<=45||activePax(customers,tour.tourCode)>=28))out.push("Collect balance payment");

  if(tour.status==="Cancelled"&&!boolify(c.informedCancellation))out.push("Inform customer about cancellation");

async function sheetsReq(path,method="GET",body=null){if(!_token)throw new Error("NOT_SIGNED_IN");const opts={method,headers:{Authorization:`Bearer ${_token}`,"Content-Type":"application/json"}};if(body)opts.body=JSON.stringify(body);const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${GC.SHEET_ID}${path}`,opts);if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.error?.message||"Sheets API error")}return r.json()}
