function fmtDate(d){if(!d)return'—';const x=new Date(d);if(isNaN(x))return upper(d);return String(x.getDate()).padStart(2,'0')+' '+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][x.getMonth()]+' '+x.getFullYear()}

function parseVoucher(s){try{return JSON.parse(s||'[]')||[]}catch{return[]}}function voucherTotal(c){const today=new Date().toISOString().slice(0,10);return parseVoucher(c.voucherJson).filter(v=>!bool(v.used)&&(!v.expiry||v.expiry>=today)&&!bool(v.nextTourOnly)).reduce((s,v)=>s+Number(v.amount||0),0)}

function birthdayInTour(dob,dep,arr){if(!dob||!dep||!arr)return false;const d=new Date(dob), start=new Date(dep), end=new Date(arr);const y=start.getFullYear();let b=new Date(y,d.getMonth(),d.getDate());if(b<start&&end.getFullYear()>y)b=new Date(end.getFullYear(),d.getMonth(),d.getDate());return b>=start&&b<=end}function birthdayVoucher(c,t){if(!birthdayInTour(c.dob,t.departureDate,t.arrivalDate))return null;const y=new Date(t.departureDate).getFullYear(),d=new Date(c.dob);let from=new Date(y,d.getMonth(),d.getDate());const start=new Date(t.departureDate),end=new Date(t.arrivalDate);if(from<start&&end.getFullYear()>y)from=new Date(end.getFullYear(),d.getMonth(),d.getDate());const to=new Date(from);to.setFullYear(to.getFullYear()+1);return{type:'Birthday Voucher RM500',amount:500,expiry:to.toISOString().slice(0,10),validFrom:from.toISOString().slice(0,10),used:false,nextTourOnly:true,note:'Auto birthday voucher - valid for next tour only, not this tour'}}

async function getRows(sheet,cols){try{const r=await sheetsReq(`/values/${encodeURIComponent(sheet)}`);const rows=r.values||[];if(rows.length<2)return[];const headers=rows[0].length?rows[0]:cols;return rows.slice(1).filter(r=>r.some(c=>c)).map(r=>rowToObj(headers,r,cols))}catch{return[]}}async function writeRows(sheet,cols,objects){await sheetsReq(`/values/${encodeURIComponent(sheet)}:clear`,'POST');const values=[cols,...objects.map(o=>objToRow(cols,o))];await sheetsReq(`/values/${encodeURIComponent(sheet)}?valueInputOption=RAW`,'PUT',{values})}
async function loadData(){state.sync='loading';render();await ensureTabs();let [t,c,tk,v]=await Promise.all([getRows(SHEETS.TOURS,TOUR_COLS),getRows(SHEETS.CUSTOMERS,CUST_COLS),getRows(SHEETS.TASKS,TASK_COLS),getRows(SHEETS.VOUCHERS,VOUCHER_COLS)]);state.tours=t;state.customers=c;state.tasks=tk;state.vouchers=v.length?v:DEFAULT_VOUCHERS;state.sync='saved'}
function render(){const app=$('app');if(!state.signed){app.innerHTML=`<div style="min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a5f);display:flex;align-items:center;justify-content:center;padding:24px"><div class="card" style="max-width:520px;text-align:center;padding:40px"><div style="font-size:56px">✈️</div><h1>Tour Ops System</h1><p class="small" style="margin:12px 0 28px">Real-time tour & customer management backed by Google Sheets.</p><button class="btn primary" onclick="signIn()" style="width:100%;padding:14px">🔑 Sign in with Google</button><div class="notice" style="background:#f8fafc;margin-top:18px;text-align:left">Make sure <b>https://jingwei-ee.github.io</b> is added as an Authorised JavaScript Origin.</div></div></div>`;return}const cur=currentTour();app.innerHTML=`<div class="top"><b>✈️ Tour Ops</b><span class="small" style="color:#cbd5e1">${esc(state.sync)}</span><div style="margin-left:auto" class="rowtools"><button class="btn ghost" onclick="loadData().then(render)">Refresh</button><button class="btn primary" onclick="newTour()">+ New Tour</button><button class="btn" onclick="goDashboard()">Dashboard</button><button class="btn" onclick="goVouchers()">🎟️ Vouchers</button><button class="btn" onclick="goCustomerDB()">📋 Customer DB</button>${cur?`<button class="btn" onclick="goTour('${esc(cur.tourCode)}')">Current Tour</button>`:''}</div></div><div class="shell"><aside class="side">${sidebarHtml()}</aside><main class="main">${mainHtml()}</main></div>`}
function currentTour(){return state.tours.find(t=>t.tourCode===state.selectedTourCode)||state.tours[0]||null}function sidebarHtml(){const q='';return`<div class="rowtools" style="margin-bottom:10px"><button class="btn" onclick="goDashboard()">Dashboard</button><button class="btn" onclick="goVouchers()">🎟️</button><button class="btn" onclick="goCustomerDB()">📋 DB</button></div><input id="sideSearch" placeholder="Search tour..." oninput="filterSide()" style="margin-bottom:10px"><div class="small" style="font-weight:900;margin-bottom:8px">Tours</div><div id="sideList" style="max-height:calc(100vh - 190px);overflow:auto">${state.tours.map(t=>sideTourButton(t)).join('')}</div>`}function sideTourButton(t){const active=t.tourCode===state.selectedTourCode;return`<button class="sideTour ${active?'active':''}" data-side-tour="${esc((t.tourCode+' '+t.tourName).toLowerCase())}" onclick="goTour('${esc(t.tourCode)}')"><div style="font-weight:900">${esc(t.tourCode)}</div><div class="small">${esc(t.tourName||'—')}</div><div class="small">${fmtDate(t.departureDate)} · ${esc(t.status||'Pending')}</div></button>`}function filterSide(){const q=($('sideSearch').value||'').toLowerCase();document.querySelectorAll('[data-side-tour]').forEach(b=>b.style.display=b.dataset.sideTour.includes(q)?'block':'none')}
function mainHtml(){if(state.view==='vouchers')return vouchersHtml();if(state.view==='customerdb')return customerDbHtml();if(state.view==='tourForm')return tourFormHtml(state.editingTour||ET);if(state.view==='customerForm')return customerFormHtml(state.editingCustomer||{...EC,tourCode:state.selectedTourCode});if(state.view==='tour')return tourDetailHtml(currentTour());return dashboardHtml()}function goDashboard(){state.view='dashboard';render()}function goVouchers(){state.view='vouchers';render()}function goCustomerDB(){state.view='customerdb';render();setTimeout(renderCustomerDbRows,0)}function goTour(code){state.selectedTourCode=code;state.view='tour';render()}function newTour(){state.editingTour=null;state.view='tourForm';render()}function editTour(code){state.editingTour=state.tours.find(t=>t.tourCode===code)||ET;state.view='tourForm';render()}function newCustomer(){state.editingCustomer={...EC,tourCode:state.selectedTourCode};state.view='customerForm';render()}function editCustomer(id){state.editingCustomer=state.customers.find(c=>c.id===id)||EC;state.view='customerForm';render()}
function dashboardHtml(){const rows=state.tours;return`<div class="grid"><div class="grid grid4">${stat('Tours',state.tours.length)}${stat('Active Travellers',state.customers.filter(c=>c.status==='Active').length)}${stat('Pending Tasks',state.tasks.filter(t=>t.status!=='Done').length,'#fef3c7','#92400e')}${stat('Cancelled / Transfer',state.customers.filter(c=>c.status!=='Active').length)}</div><div class="rowtools"><input id="dashSearch" placeholder="Search tour..." oninput="filterDashboard()" style="max-width:420px"><select id="dashStatus" onchange="filterDashboard()" style="max-width:180px"><option>All</option>${TOUR_STATUSES.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn primary" onclick="goVouchers()">🎟️ Go to Voucher Sheet</button></div>${notificationWallHtml()}<div class="card"><div class="section">🗺️ Dashboard</div><div style="overflow:auto"><table class="table"><thead><tr>${['Code','Tour','Airline','Date','D/N','Pax','Seats Used','Meals','Normal Fare','After Tier','Balance','Manager','Status',''].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="dashRows">${rows.map(dashRow).join('')}</tbody></table></div></div></div>`}
function dashRow(t){const pax=activePax(t.tourCode),pc=paxColor(pax),dn=calcDN(t.departureDate,t.arrivalDate);const bal=state.customers.filter(c=>c.tourCode===t.tourCode||c.transferToTour===t.tourCode).reduce((s,c)=>s+calcFare(c,t).balance,0);const after=Number(t.normalPrice||0)-(bool(t.isSpecialDiscount)?Number(t.specialDiscount||0):getDiscount(pax));return`<tr data-dash="${esc((t.tourCode+' '+t.tourName+' '+t.tourManager+' '+t.status).toLowerCase())}" data-status="${esc(t.status||'Pending')}"><td style="font-weight:900;color:#2563eb;cursor:pointer" onclick="goTour('${esc(t.tourCode)}')">${esc(t.tourCode)}</td><td>${esc(t.tourName)}</td><td>${esc(t.airline||'—')}</td><td>${fmtDate(t.departureDate)} → ${fmtDate(t.arrivalDate)}</td><td>${dn.days?dn.days+'D/'+dn.nights+'N':'—'}</td><td><span class="badge" style="background:${pc.bg};color:${pc.col}">${pax}</span></td><td>${groupSeatUsed(t.tourCode)} / ${esc(t.groupSeats||'—')}</td><td>${esc(t.mealIncluded||0)} in / ${esc(t.mealExcluded||0)} out</td><td>${fmt(t.normalPrice)}</td><td style="font-weight:900;color:#166534">${fmt(after)}</td><td style="font-weight:900;color:${bal>0?'#dc2626':'#16a34a'}">${fmt(Math.abs(bal))}</td><td>${esc(t.tourManager||'—')}</td><td>${badge(t.status)}</td><td><button class="btn" onclick="editTour('${esc(t.tourCode)}')">Edit</button></td></tr>`}function filterDashboard(){const q=($('dashSearch').value||'').toLowerCase(),st=$('dashStatus').value;document.querySelectorAll('#dashRows tr').forEach(r=>r.style.display=(r.dataset.dash.includes(q)&&(st==='All'||r.dataset.status===st))?'':'none')}
function stat(label,value,bg,col){return`<div class="stat" style="background:${bg||'#fff'};color:${col||'#1e293b'}"><div class="small" style="font-weight:900;text-transform:uppercase">${label}</div><div class="v">${esc(value)}</div></div>`}function badge(s){const m={Pending:'#94a3b8',Confirmed:'#3b82f6',Departed:'#f59e0b',Completed:'#22c55e',Cancelled:'#ef4444',Active:'#22c55e',Transferred:'#a855f7'};return`<span class="badge" style="background:${m[s]||'#94a3b8'};color:#fff">${esc(s||'Pending')}</span>`}
function notificationWallHtml(tourCode){let rows=state.tasks.filter(t=>t.status!=='Done');if(tourCode)rows=rows.filter(t=>t.tourCode===tourCode);rows=rows.slice(0,8);return`<div class="card"><div class="section">🔔 Notification Wall ${tourCode?esc(tourCode)+'_update':'& Pending Tasks'}</div>${rows.length?rows.map(t=>`<div class="notice" style="background:#fff7ed;border:1px solid #fed7aa;margin-bottom:6px"><b>${esc(t.tourCode)}_update</b> · ${esc(t.category||'Update')} · ${esc(t.title)}<div class="small">${esc(t.notes||'')}</div><button class="btn" onclick="markTaskDone('${esc(t.id)}')" style="margin-top:6px">Mark Done</button></div>`).join(''):'<div class="small">No pending updates.</div>'}</div>`}async function markTaskDone(id){const a=state.tasks.map(t=>t.id===id?{...t,status:'Done',updatedAt:new Date().toISOString()}:t);state.tasks=a;await writeRows(SHEETS.TASKS,TASK_COLS,a);render()}
function flightPanel(t){return`<div class="card" style="background:#f0f9ff;border-color:#bae6fd"><div class="section">✈️ Flight Details | PNR: ${esc(t.flightPNR||'—')} | Group Seats: ${groupSeatUsed(t.tourCode)} / ${esc(t.groupSeats||'—')}</div><div class="grid grid3"><div><b style="color:#166534">Departure Day (In)</b>${flightLine(t,'depFlight1')}${flightLine(t,'depFlight2')}</div><div><b style="color:#dc2626">Arrival Day (Out)</b>${flightLine(t,'arrFlight1')}${flightLine(t,'arrFlight2')}</div><div><b>Domestic Flight</b>${flightLine(t,'domFlight1')}${flightLine(t,'domFlight2')}</div></div></div>`}function flightLine(t,p){return t[p+'Code']?`<div class="small mono" style="background:#1e293b;color:#e2e8f0;border-radius:6px;padding:6px 8px;margin-top:5px">${esc(t[p+'Code'])} ${esc(dateToDDMMM(t[p+'Date'])||t[p+'Date'])} ${esc(t[p+'From'])}→${esc(t[p+'To'])} ${esc(t[p+'Depart'])} ${esc(t[p+'Arrive'])}</div>`:'<div class="small" style="margin-top:5px">—</div>'}
function tourDetailHtml(t){if(!t)return'<div class="card">No tour selected.</div>';const pax=activePax(t.tourCode),pc=paxColor(pax),dn=calcDN(t.departureDate,t.arrivalDate);return`<div class="grid"><div class="rowtools"><button class="btn" onclick="goDashboard()">← Back</button><h2>${esc(t.tourCode)} — ${esc(t.tourName)}</h2>${badge(t.status)}<div style="margin-left:auto" class="rowtools"><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="editTour('${esc(t.tourCode)}')">Edit Tour</button><button class="btn primary" onclick="newCustomer()">+ Customer</button></div></div><div class="grid grid6">${stat('Departure',fmtDate(t.departureDate))}${stat('Arrival',fmtDate(t.arrivalDate))}${stat('Days/Nights',dn.days?dn.days+'D / '+dn.nights+'N':'—')}${stat('Active Pax',pax,pc.bg,pc.col)}${stat('Group Seats Used',groupSeatUsed(t.tourCode)+' / '+(t.groupSeats||'—'))}${stat('Manager',t.tourManager||'—')}</div>${flightPanel(t)}${notificationWallHtml(t.tourCode)}<div class="card"><div class="section">👥 Tour Customer List</div><div class="rowtools" style="margin-bottom:10px"><input id="custFilter" placeholder="Filter by name, group, room, meal, visa, passport, extension..." oninput="renderCustomerRows()" style="max-width:430px"><select id="infoSection" onchange="renderCustomerRows()" style="max-width:230px"><option value="main">Main Info</option><option value="room">Room & Group</option><option value="meal">Meal</option><option value="passport">Passport & Visa</option><option value="payment">Payment</option><option value="flight">Flight & Extension</option><option value="update">Update & Pending</option></select><button class="tab active" id="tabActive" onclick="setCustView('Active')">Active</button><button class="tab" id="tabAll" onclick="setCustView('All')">All</button><button class="tab" id="tabInactive" onclick="setCustView('Inactive')">Inactive</button>${groupChips(t.tourCode)}</div><div style="overflow:auto"><table class="table"><thead id="custHead"></thead><tbody id="custRows"></tbody></table></div></div><div class="card"><div class="section">↔️ Cancelled / Transferred Customers From This Tour</div><div style="overflow:auto"><table class="table"><thead><tr>${['Name','Contact','Birthday','Room','Meal','Visa','Passport','Flight & Hotel Extension','Fare','Balance','Status',''].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${customerRows(t,'Inactive','main')}</tbody></table></div></div></div>`}
function groupChips(code){return[...new Set(state.customers.filter(c=>isActiveInTour(c,code)&&c.groupName).map(c=>c.groupName))].slice(0,12).map(g=>`<button class="badge" style="border:0;cursor:pointer;background:${hashColor(g,.25)};color:${hashColor(g,1)}" onclick="setGroupFilter('${esc(g)}')">${esc(g)}</button>`).join('')}function setGroupFilter(g){$('custFilter').value=g;renderCustomerRows()}function setCustView(v){state.customerView=v;['Active','All','Inactive'].forEach(x=>{$('tab'+x).className='tab '+(x===v?'active':'')});renderCustomerRows()}function renderCustomerRows(){const t=currentTour();if(!t)return;const sec=$('infoSection')?.value||'main';const headers=sectionHeaders(sec);$('custHead').innerHTML='<tr>'+headers.map(x=>`<th>${x}</th>`).join('')+'</tr>';$('custRows').innerHTML=customerRows(t,state.customerView,sec)}function sectionHeaders(sec){return{main:['Name','Contact','Birthday','Room','Meal','Visa','Passport','Flight & Hotel Extension','Fare','Balance','Status',''],room:['Name','Booking','Group','Room Type','Room Partner','Room Group','Status',''],meal:['Name','Meal','Other Meal Preference','Status',''],passport:['Name','Birthday','Passport No.','Issue','Expiry','Visa','Status',''],payment:['Name','Fare','Paid','Balance','Payment Method','Voucher/Credit','Status',''],flight:['Name','No Intl','Different PNR','Another PNR','Member No.','Seats 1-4','Domestic Seats','Extension','Status',''],update:['Name','Date Change Informed','Cancellation Informed','Cancel Bank','Status','']}[sec]||[]}
function customerRows(t,view,sec){let rows=[];if(view==='Active')rows=state.customers.filter(c=>isActiveInTour(c,t.tourCode));else if(view==='Inactive')rows=state.customers.filter(c=>isInactiveOriginal(c,t.tourCode));else rows=state.customers.filter(c=>isActiveInTour(c,t.tourCode)||isInactiveOriginal(c,t.tourCode));const f=($('custFilter')?.value||'').toLowerCase();if(f)rows=rows.filter(c=>(fullName(c)+' '+c.contact+' '+c.groupName+' '+c.roomGroup+' '+c.status+' '+c.mealRestriction+' '+c.visaStatus+' '+c.roomPartner+' '+c.flightHotelExtension+' '+c.passportNo).toLowerCase().includes(f));return rows.map(c=>customerRow(c,t,sec)).join('')||`<tr><td colspan="12" class="small">No customers.</td></tr>`}
function customerRow(c,t,sec){const fare=calcFare(c,t);const gcol=hashColor(c.groupName,.18),gtext=hashColor(c.groupName,1);const roomcol=hashColor(c.roomGroup||c.roomPartner,.10);const bday=birthdayInTour(c.dob,t.departureDate,t.arrivalDate);const name=`<td style="background:${gcol||''};color:${gtext||''};border-left:${gcol?'4px solid '+gtext:''}"><b>${esc(fullName(c))}</b><div class="small" style="color:${gtext||'#64748b'};font-weight:${c.bookingType==='Group'?800:400}">${c.bookingType==='Group'?'Group: '+esc(c.groupName||'—'):'Individual'}</div>${c.status==='Transferred'&&c.transferToTour===t.tourCode?`<div class="small" style="color:#7c3aed;font-weight:800">Transferred from ${esc(c.tourCode)}</div>`:''}</td>`;const bdaytd=`<td style="background:${bday?'#fef3c7':''};color:${bday?'#92400e':''};font-weight:${bday?900:400}">${fmtDate(c.dob)}${bday?' 🎂':''}</td>`;const edit=`<td><button class="btn" onclick="editCustomer('${esc(c.id)}')">Edit</button></td>`;if(sec==='room')return`<tr>${name}<td>${esc(c.bookingType)}</td><td>${esc(c.groupName||'—')}</td><td>${esc(c.roomType||'—')}</td><td style="background:${roomcol||''}">${esc(c.roomPartner||'—')}</td><td style="background:${roomcol||''}">${esc(c.roomGroup||'—')}</td><td>${badge(c.status)}</td>${edit}</tr>`;if(sec==='meal')return`<tr>${name}<td>${esc(c.mealRestriction||'—')}</td><td>${esc(c.mealOther||'—')}</td><td>${badge(c.status)}</td>${edit}</tr>`;if(sec==='passport')return`<tr>${name}${bdaytd}<td>${esc(c.passportNo||'—')}</td><td>${fmtDate(c.passportIssue)}</td><td>${fmtDate(c.passportExpiry)}</td><td>${esc(c.visaStatus||'—')}</td><td>${badge(c.status)}</td>${edit}</tr>`;if(sec==='payment')return`<tr>${name}<td>${fmt(fare.fare)}</td><td>${fmt(fare.paid)}</td><td style="font-weight:900;color:${fare.balance>0?'#dc2626':'#16a34a'}">${fmt(Math.abs(fare.balance))}</td><td>${esc([c.payment1Method,c.payment2Method,c.payment3Method].filter(Boolean).join(' / ')||'—')}</td><td>${fmt(Number(c.cashVoucherUsed||0)+Number(c.travelCreditUsed||0))}</td><td>${badge(c.status)}</td>${edit}</tr>`;if(sec==='flight')return`<tr>${name}<td>${bool(c.noIntlFlight)?'YES':'No'}</td><td>${bool(c.differentPNR)?'YES':'No'}</td><td>${esc(c.anotherPNR||'—')}</td><td>${esc(c.airlineMemberNo||'—')}</td><td>${esc([c.flight1Seat,c.flight2Seat,c.flight3Seat,c.flight4Seat].filter(Boolean).join(' / ')||'—')}</td><td>${esc([c.domesticSeat1,c.domesticSeat2].filter(Boolean).join(' / ')||'—')}</td><td>${esc(c.flightHotelExtension||'—')}</td><td>${badge(c.status)}</td>${edit}</tr>`;if(sec==='update')return`<tr>${name}<td>${bool(c.informedDateChange)?'YES':''} ${fmtDate(c.informedDateChangeDate)}</td><td>${bool(c.informedCancellation)?'YES':''} ${fmtDate(c.informedCancellationDate)}</td><td>${esc([c.cancelBankName,c.cancelBankAccountName,c.cancelBankAccountNo].filter(Boolean).join(' / ')||'—')}</td><td>${badge(c.status)}</td>${edit}</tr>`;return`<tr>${name}<td>${esc(c.contact||'—')}</td>${bdaytd}<td>${esc(c.roomType||'—')}</td><td>${esc(c.mealRestriction==='Other'?c.mealOther||'Other':c.mealRestriction||'—')}</td><td>${esc(c.visaStatus||'—')}</td><td>${esc(c.passportNo||'—')}</td><td>${esc(c.flightHotelExtension||'—')}</td><td>${fmt(fare.fare)}</td><td style="font-weight:900;color:${fare.balance>0?'#dc2626':'#16a34a'}">${fmt(Math.abs(fare.balance))}</td><td>${badge(c.status)}</td>${edit}</tr>`}
function vouchersHtml(){const rules=state.vouchers.filter(r=>(r.recordKind||'RULE')==='RULE');const holders=[...autoHolderRows(),...state.vouchers.filter(r=>r.recordKind==='HOLDER')];return`<div class="grid"><div class="rowtools"><button class="btn" onclick="goDashboard()">← Back to Dashboard</button><h2>🎟️ Voucher Sheet</h2><div style="margin-left:auto" class="rowtools"><button class="btn" onclick="addVoucherRule()">+ Add Voucher Rule</button><button class="btn primary" onclick="saveVoucherSheet()">Save Voucher Sheet</button></div></div><div class="card"><div class="section">📌 Voucher Sheet</div><div class="notice" style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;margin-bottom:10px">Ongoing voucher rules are separated here. Regular = Lifetime, Birthday = one year from DOB, Group = Lifetime, Early Bird / Campaign = campaign period.</div><div style="overflow:auto"><table class="table"><thead><tr>${['Voucher','Amount','Period','Event','T&C',''].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rules.map((r,i)=>voucherRuleRow(r,i)).join('')}</tbody></table></div></div><div class="card"><div class="section">👤 Traveller Voucher Holdings</div><div class="notice" style="background:#fefce8;border:1px solid #fde68a;color:#854d0e;margin-bottom:10px">Regular and Birthday holders are auto-generated. Only Campaign Discount holders need manual entry by traveller NAME.</div><div style="overflow:auto"><table class="table"><thead><tr>${['Traveller','Voucher','Amount','Expiry','Used Tour','Used Date','Remark',''].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${holders.map((r,i)=>holderRow(r,i)).join('')}</tbody></table></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" onclick="addCampaignHolder()">+ Add Campaign Entitlement</button><button class="btn primary" onclick="saveVoucherSheet()">Save Voucher Sheet</button></div></div></div>`}
function voucherRuleRow(r,i){const idx=state.vouchers.indexOf(r);return`<tr><td><input value="${esc(r.voucherName)}" onchange="vUpdate(${idx},'voucherName',this.value)"></td><td><input type="number" value="${esc(r.amount)}" onchange="vUpdate(${idx},'amount',this.value)"></td><td><input value="${esc(r.period)}" onchange="vUpdate(${idx},'period',this.value)"></td><td><input value="${esc(r.event)}" onchange="vUpdate(${idx},'event',this.value)"></td><td><textarea onchange="vUpdate(${idx},'terms',this.value)">${esc(r.terms)}</textarea></td><td><button class="btn danger" onclick="removeVoucher(${idx})">Remove</button></td></tr>`}function holderRow(r,i){const auto=String(r.id||'').startsWith('auto_'),idx=state.vouchers.indexOf(r);if(auto)return`<tr style="background:#f8fafc"><td><b>${esc(r.travellerName)}</b></td><td>${esc(r.voucherName)}</td><td>${esc(r.amount)}</td><td>${esc(r.expiry)}</td><td>${esc(r.usedTour||'—')}</td><td>${esc(r.usedDate||'—')}</td><td>${esc(r.remark)}</td><td><span class="badge" style="background:#dbeafe;color:#1d4ed8">Auto</span></td></tr>`;return`<tr><td><input value="${esc(r.travellerName)}" onchange="vUpdate(${idx},'travellerName',this.value.toUpperCase())"></td><td><input value="${esc(r.voucherName)}" onchange="vUpdate(${idx},'voucherName',this.value)" placeholder="Campaign Discount"></td><td><input type="number" value="${esc(r.amount)}" onchange="vUpdate(${idx},'amount',this.value)"></td><td><input type="date" value="${esc(r.expiry)}" onchange="vUpdate(${idx},'expiry',this.value)"></td><td><input value="${esc(r.usedTour)}" onchange="vUpdate(${idx},'usedTour',this.value.toUpperCase())"></td><td><input type="date" value="${esc(r.usedDate)}" onchange="vUpdate(${idx},'usedDate',this.value)"></td><td><textarea onchange="vUpdate(${idx},'remark',this.value)">${esc(r.remark)}</textarea></td><td><button class="btn danger" onclick="removeVoucher(${idx})">Remove</button></td></tr>`}function vUpdate(i,k,v){state.vouchers[i]={...state.vouchers[i],[k]:v}}function addVoucherRule(){state.vouchers.push({id:'rule_'+Date.now(),recordKind:'RULE',voucherName:'',amount:'',period:'',event:'',terms:''});render()}function addCampaignHolder(){state.vouchers.push({id:'holder_'+Date.now(),recordKind:'HOLDER',travellerName:'',voucherName:'Campaign Discount',amount:'',expiry:'',usedTour:'',usedDate:'',remark:''});render()}function removeVoucher(i){state.vouchers.splice(i,1);render()}async function saveVoucherSheet(){await writeRows(SHEETS.VOUCHERS,VOUCHER_COLS,state.vouchers);alert('Voucher Sheet saved.');render()}

function customerDbHtml(){return `<div class="card"><div class="rowtools"><h2>📋 Customer Database</h2><div style="margin-left:auto" class="rowtools"><input id="dbSearch" placeholder="Search customer name / phone / passport..." oninput="renderCustomerDbRows()" style="width:320px"><select id="dbSort" onchange="renderCustomerDbRows()" style="width:260px"><option value="latest">Latest sign-up → oldest</option><option value="oldest">Oldest sign-up → latest</option><option value="most">Highest number joined → least</option><option value="least">Least number joined → highest</option></select></div></div><div class="notice" style="background:#f0f9ff;border:1px solid #bae6fd;color:#0369a1;margin-bottom:12px">This database is auto-built from all customer records. Search by name, phone or passport. Returning sign-up can reuse personal, passport, airline membership and meal preference only.</div><div style="overflow:auto"><table class="table"><thead><tr>${['Title','Name','Phone Number','Email','Address','Passport Number','No. of Tours Joined','Which Tour Joined'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody id="customerDbRows"></tbody></table></div></div>`}
function buildCustomerDb(){const map=new Map();state.customers.forEach(c=>{const key=(c.contact||c.passportNo||fullName(c)).toUpperCase();if(!key)return;const ts=Number(String(c.id||'').replace(/\D/g,''))||0;if(!map.has(key))map.set(key,{title:c.title,name:fullName(c),phone:c.contact,email:c.email,address:c.address,passport:c.passportNo,tours:new Set(),latest:ts,oldest:ts});const r=map.get(key);['title','phone','email','address','passport'].forEach(k=>{if(!r[k]&&({title:c.title,phone:c.contact,email:c.email,address:c.address,passport:c.passportNo})[k])r[k]=({title:c.title,phone:c.contact,email:c.email,address:c.address,passport:c.passportNo})[k]});if(c.status!=='Cancelled'&&c.tourCode)r.tours.add(c.tourCode);r.latest=Math.max(r.latest,ts);r.oldest=Math.min(r.oldest||ts,ts);});return [...map.values()].map(r=>({...r,count:r.tours.size,tourList:[...r.tours].join(', ')}))}
function renderCustomerDbRows(){const box=$('customerDbRows');if(!box)return;let rows=buildCustomerDb();const q=($('dbSearch')?.value||'').toLowerCase();if(q)rows=rows.filter(r=>(r.name+' '+r.phone+' '+r.passport).toLowerCase().includes(q));const sort=$('dbSort')?.value||'latest';rows.sort((a,b)=>sort==='latest'?b.latest-a.latest:sort==='oldest'?a.oldest-b.oldest:sort==='most'?b.count-a.count:a.count-b.count);box.innerHTML=rows.map(r=>`<tr><td>${esc(r.title||'')}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.phone||'')}</td><td>${esc(r.email||'')}</td><td>${esc(r.address||'')}</td><td>${esc(r.passport||'')}</td><td><b>${r.count}</b></td><td>${esc(r.tourList||'—')}</td></tr>`).join('')||'<tr><td colspan="8" class="small">No customer found.</td></tr>'}
function tourFormHtml(t){const hub=airlineTransit(t.airline);const dn=calcDN(t.departureDate,t.arrivalDate);return`<div class="card"><div class="rowtools"><button class="btn" onclick="goDashboard()">← Back</button><h2>${t.id?'Edit Tour':'New Tour'}</h2><div style="margin-left:auto"><button class="btn primary" onclick="saveTourForm()">Save Tour</button></div></div><form id="tourForm" class="grid" onsubmit="return false">${airportDatalist()}<div class="grid grid3">${input('Tour Code','tourCode',t.tourCode)}<div style="grid-column:span 2">${input('Tour Name','tourName',t.tourName)}</div></div><div class="grid grid4">${input('Airline','airline',t.airline,'text',{placeholder:'Qatar / Emirates / Turkish / Other'})}${input('Tour Manager','tourManager',t.tourManager)}${input('Status','status',t.status,'text',{select:TOUR_STATUSES})}<div><label>Active Pax</label><div style="padding:8px;font-weight:900;color:${paxColor(activePax(t.tourCode)).col}">${activePax(t.tourCode)} ${activePax(t.tourCode)>=18?'· Auto Confirm':''}</div></div></div><div class="grid grid4">${input('Departure Date (fly out)','departureDate',t.departureDate,'date')}${input('Arrival Date (home)','arrivalDate',t.arrivalDate,'date')}<div><label>Days / Nights</label><div style="padding:8px;border:1px solid #cbd5e1;border-radius:8px">${dn.days?dn.days+'D / '+dn.nights+'N':'—'}</div></div>${input('No International Flight Deduction (RM)','noIntlDeductAmount',t.noIntlDeductAmount,'number')}</div><div class="grid grid4">${input('Normal Price','normalPrice',t.normalPrice,'number')}${input('Single Supplement','singleSupplement',t.singleSupplement,'number')}${input('Meals Included (number)','mealIncluded',t.mealIncluded,'number')}${input('Meals Excluded (number)','mealExcluded',t.mealExcluded,'number')}</div><div class="grid grid2">${checkbox('Special case / override discount','isSpecialDiscount',t.isSpecialDiscount)}${input('Special Discount','specialDiscount',t.specialDiscount,'number')}</div><div class="card" style="background:#f0f9ff;border-color:#bae6fd"><div class="section">✈️ Flight Details</div><div class="notice" style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;margin-bottom:10px">Auto helper: ${hub.code?hub.code+' flights usually transit via '+hub.hub:'select Qatar / Emirates / Turkish to suggest transit city'}. Keep flexibility for code-share or different airline.</div><div class="grid grid4">${input('Flight PNR','flightPNR',t.flightPNR)}${input('Group Seat (Number)','groupSeats',t.groupSeats,'number')}<div><label>Group seats used</label><div style="padding:8px;font-weight:900">${groupSeatUsed(t.tourCode)} / ${t.groupSeats||'—'}</div></div><button type="button" class="btn" onclick="autoFillFlightForm()">Auto-fill dates & transit</button></div><div class="section">🛫 Departure Date (In)</div>${legInputs(t,'depFlight1','Departure Flight 1 — Hometown → Transit','KUL',hub.hub)}${legInputs(t,'depFlight2','Departure Flight 2 — Transit → Destination',hub.hub,'')}<div class="section">🛬 Arrival Day (Out)</div>${legInputs(t,'arrFlight1','Return Flight 1 — Destination → Transit','',hub.hub)}${legInputs(t,'arrFlight2','Return Flight 2 — Transit → Hometown',hub.hub,'KUL')}<div class="section">Domestic Flight (0–2 times)</div>${legInputs(t,'domFlight1','Domestic Flight 1','','')}${legInputs(t,'domFlight2','Domestic Flight 2','','')}</div>${input('Date Change Note / Update to customer','dateChangeNote',t.dateChangeNote,'textarea')}${input('Cancellation Update Note','cancelUpdateNote',t.cancelUpdateNote,'textarea')}<input type="hidden" name="id" value="${esc(t.id)}"></form></div>`}function legInputs(t,p,label,from,to){return`<div class="card" style="background:#f8fafc"><b>${esc(label)}</b><div class="grid grid5" style="margin-top:8px">${input('Flight Code',p+'Code',t[p+'Code'])}${input('Date',p+'Date',t[p+'Date'],'date')}${airportInput('From',p+'From',t[p+'From']||from)}${airportInput('To',p+'To',t[p+'To']||to)}${timePairInput('Time',p,t)}</div></div>`}function formObj(form,cols,base){const fd=new FormData(form);const o={...base};cols.forEach(k=>{if(fd.has(k))o[k]=fd.get(k)});form.querySelectorAll('input[type=checkbox]').forEach(i=>o[i.name]=i.checked);return o}function autoFillFlightForm(){const f=$('tourForm');const hub=airlineTransit(f.airline.value);if(f.departureDate.value){f.depFlight1Date.value=f.departureDate.value;f.depFlight2Date.value=f.departureDate.value}if(f.arrivalDate.value){f.arrFlight2Date.value=f.arrivalDate.value;f.arrFlight1Date.value=addDaysISO(f.arrivalDate.value,-1)}if(hub.hub){if(!f.depFlight1To.value)f.depFlight1To.value=hub.hub;if(!f.depFlight2From.value)f.depFlight2From.value=hub.hub;if(!f.arrFlight1To.value)f.arrFlight1To.value=hub.hub;if(!f.arrFlight2From.value)f.arrFlight2From.value=hub.hub;if(!f.depFlight1Code.value)f.depFlight1Code.value=hub.code;if(!f.depFlight2Code.value)f.depFlight2Code.value=hub.code;if(!f.arrFlight1Code.value)f.arrFlight1Code.value=hub.code;if(!f.arrFlight2Code.value)f.arrFlight2Code.value=hub.code}}
async function saveTourForm(){const form=$('tourForm');let t=formObj(form,TOUR_COLS,ET);t.id=t.id||'tour_'+Date.now();const old=state.tours.find(x=>x.id===t.id)||state.tours.find(x=>x.tourCode===t.tourCode)||{};const pax=activePax(t.tourCode);if(!bool(t.isSpecialDiscount)&&pax>=18&&!['Cancelled','Departed','Completed'].includes(t.status))t.status='Confirmed';let arr=state.tours.some(x=>x.id===t.id)?state.tours.map(x=>x.id===t.id?t:x):[...state.tours,t];state.tours=arr;await writeRows(SHEETS.TOURS,TOUR_COLS,arr);if(old.id&&flightSig(old)!==flightSig(t)){state.tasks.push(makeTask(t.tourCode,'','Flight details changed - inform affected travellers','Flight Change','Flight / PNR / seat count / domestic flight details changed. Review tour customers and notify those who should take note.'));await writeRows(SHEETS.TASKS,TASK_COLS,state.tasks)}state.selectedTourCode=t.tourCode;state.view='tour';render()}
function customerFormHtml(c){const t=state.tours.find(x=>x.tourCode===c.tourCode)||ET;const f=calcFare(c,t);return`<div class="card"><div class="rowtools"><button class="btn" onclick="goTour('${esc(c.tourCode||state.selectedTourCode)}')">← Back</button><h2>${c.id?'Edit Customer':'Add Customer'}</h2><div style="margin-left:auto"><button class="btn primary" onclick="saveCustomerForm()">Save Customer</button></div></div><form id="custForm" class="grid" onsubmit="return false"><input type="hidden" name="id" value="${esc(c.id)}"><div class="notice" style="background:#f0f9ff;border:1px solid #bae6fd;color:#0369a1"><b>Returning customer quick-fill</b><input id="custLookup" placeholder="Search existing customer by name or phone..." oninput="showCustomerLookup()" style="margin-top:8px"><div id="lookupResults" class="grid" style="margin-top:8px"></div></div><div class="section">👤 Personal & Status</div><div class="grid grid3">${input('Tour Code','tourCode',c.tourCode,'text',{select:state.tours.map(t=>t.tourCode)})}${input('Booking Source','bookingSource',c.bookingSource,'text',{select:BOOKING_SRC})}${input('Customer Status','status',c.status,'text',{select:CUST_STATUSES})}</div><div class="grid grid4">${input('Title','title',c.title)}${input('Surname','surname',upper(c.surname))}${input('Given Name','name',upper(c.name))}${input('Contact','contact',c.contact)}</div><div class="grid grid2">${input('Email','email',c.email)}${input('Address','address',c.address)}</div><div id="statusExtra">${statusExtraHtml(c)}</div><div class="section">👥 Group & Room</div><div class="grid grid4">${input('Booking Type','bookingType',c.bookingType,'text',{select:BOOKING_TYPES})}${input('Group Name / With Who','groupName',c.groupName)}${input('Room Type','roomType',c.roomType,'text',{select:ROOM_TYPES})}${input('Room Group / Rooming Code','roomGroup',c.roomGroup)}</div>${input('Room Partner','roomPartner',c.roomPartner,'text',{select:['',...state.customers.filter(x=>x.tourCode===c.tourCode&&x.status==='Active'&&x.id!==c.id).map(fullName)]})}<div class="section">🍽️ Meal</div><div class="grid grid2">${input('Meal Restriction','mealRestriction',c.mealRestriction,'text',{select:MEAL_OPTS})}${input('Other Meal Preference','mealOther',c.mealOther)}</div><div class="section">🧳 Flight & Hotel Extension</div>${input('Flight & Hotel Extension','flightHotelExtension',c.flightHotelExtension,'textarea')}<div class="section">💰 Price</div><div class="grid grid4">${stat('Normal',fmt(f.normal))}${stat('Tier Discount','- '+fmt(f.tier))}${stat('Voucher Total','- '+fmt(f.vouchers))}${stat('Final Fare',fmt(f.fare),'#dcfce7','#166534')}</div><div class="grid grid4">${input('Upgrade/Add-on','upgradeAmount',c.upgradeAmount,'number')}${input('Cash Voucher Used','cashVoucherUsed',c.cashVoucherUsed,'number')}${input('Carry Forward / Travel Credit Used','travelCreditUsed',c.travelCreditUsed,'number')}${checkbox('Not taking international flight','noIntlFlight',c.noIntlFlight)}</div><div class="section">💳 Payment</div>${[1,2,3].map(n=>`<div class="grid grid2">${input('Payment '+n+' Amount','payment'+n,c['payment'+n],'number')}${input('Payment '+n+' Method','payment'+n+'Method',c['payment'+n+'Method'],'text',{select:PAY_METHODS})}</div>`).join('')}<div class="grid grid3">${stat('Paid',fmt(f.paid))}${stat('Fare',fmt(f.fare))}${stat('Balance',fmt(Math.abs(f.balance)),f.balance>0?'#fee2e2':'#dcfce7',f.balance>0?'#dc2626':'#166534')}</div><div class="section">📗 Passport & Identity</div><div class="grid grid4">${input('DOB','dob',c.dob,'date')}<div><label>Birthday During Tour</label><div style="padding:8px;border-radius:8px;background:${birthdayInTour(c.dob,t.departureDate,t.arrivalDate)?'#fef3c7':'#f8fafc'};font-weight:900;color:${birthdayInTour(c.dob,t.departureDate,t.arrivalDate)?'#92400e':'#64748b'}">${birthdayInTour(c.dob,t.departureDate,t.arrivalDate)?'YES 🎂':'No'}</div></div>${input('Nationality','nationality',c.nationality)}${input('Passport No.','passportNo',c.passportNo)}</div><div class="grid grid2">${input('Passport Issue','passportIssue',c.passportIssue,'date')}${input('Passport Expiry','passportExpiry',c.passportExpiry,'date')}</div><div class="section">🛫 Flight</div><div class="grid grid3">${checkbox('Not taking domestic flight','noDomesticFlight',c.noDomesticFlight)}${checkbox('Different international PNR','differentPNR',c.differentPNR)}${input('Another PNR','anotherPNR',c.anotherPNR)}</div>${input('Airline Member Number','airlineMemberNo',c.airlineMemberNo)}<div class="grid grid4">${[1,2,3,4].map(n=>input('Flight '+n+' Seat','flight'+n+'Seat',c['flight'+n+'Seat'])).join('')}</div><div class="grid grid2">${input('Domestic Seat 1','domesticSeat1',c.domesticSeat1)}${input('Domestic Seat 2','domesticSeat2',c.domesticSeat2)}</div>${input('Notes','notes',c.notes,'textarea')}</form></div>`}
function statusExtraHtml(c){if(c.status==='Transferred')return`<div class="card" style="background:#f5f3ff;border-color:#ddd6fe"><div class="section">↔️ Transfer Details</div><div class="grid grid3">${input('Transfer To Tour','transferToTour',c.transferToTour,'text',{select:['',...state.tours.map(t=>t.tourCode)]})}${input('Transfer To Person','transferToPerson',c.transferToPerson)}${checkbox('Apply transfer to whole same group','applyTransferGroup',c.applyTransferGroup)}</div><div class="small">Whole-group transfer uses the current Group Name / With Who field.</div></div>`;if(c.status==='Cancelled')return`<div class="card" style="background:#fff7ed;border-color:#fed7aa"><div class="section">❌ Cancellation, Refund & Bank Details</div>${input('Cancel Reason','cancelReason',c.cancelReason)}<div class="grid grid4">${input('Refund Amount','cancelRefundAmount',c.cancelRefundAmount,'number')}${checkbox('Refund Done','cancelRefundDone',c.cancelRefundDone)}${input('Voucher Amount','cancelVoucherAmount',c.cancelVoucherAmount,'number')}${checkbox('Voucher Issued','cancelVoucherIssued',c.cancelVoucherIssued)}</div><div class="grid grid4">${input('Bank Name','cancelBankName',c.cancelBankName)}${input('Account Holder Name','cancelBankAccountName',upper(c.cancelBankAccountName))}${input('Account Number','cancelBankAccountNo',c.cancelBankAccountNo)}${input('SWIFT / Remark','cancelBankSwift',c.cancelBankSwift)}</div></div>`;return''}
function showCustomerLookup(){const q=($('custLookup').value||'').toLowerCase();const box=$('lookupResults');if(!q){box.innerHTML='';return}const rows=state.customers.filter(x=>(fullName(x)+' '+x.contact).toLowerCase().includes(q)).slice(0,8);box.innerHTML=rows.map(x=>`<button type="button" class="lookupItem" onclick="fillExistingCustomer('${esc(x.id)}')"><b>${esc(fullName(x))}</b> · ${esc(x.contact||'—')}<div class="small">Keeps personal, passport, airline member number and meal preference only.</div></button>`).join('')}
function fillExistingCustomer(id){const x=state.customers.find(c=>c.id===id);if(!x)return;const f=$('custForm');['title','surname','name','contact','email','address','dob','passportNo','nationality','passportIssue','passportExpiry','airlineMemberNo','mealRestriction','mealOther','emergencyContact','emergencyPhone'].forEach(k=>{if(f[k])f[k].value=(k==='surname'||k==='name')?upper(x[k]):(x[k]||'')});if(f.isRegular)f.isRegular.checked=true;$('lookupResults').innerHTML='';$('custLookup').value=''}
async function saveCustomerForm(){const form=$('custForm');let c=formObj(form,CUST_COLS,EC);c.id=c.id||'cust_'+Date.now();c.surname=upper(c.surname);c.name=upper(c.name);c.cancelBankAccountName=upper(c.cancelBankAccountName);c.transferFromTour=c.transferFromTour||c.tourCode;const old=state.customers.find(x=>x.id===c.id)||{};const t=state.tours.find(x=>x.tourCode===c.tourCode)||ET;const auto=birthdayVoucher(c,t);let vs=parseVoucher(c.voucherJson).filter(v=>!v.expiry||v.expiry>=new Date().toISOString().slice(0,10));if(auto&&!vs.some(v=>v.type==='Birthday Voucher RM500'&&v.validFrom===auto.validFrom))vs.push({...auto,holderName:fullName(c)});c.voucherJson=JSON.stringify(vs);let arr=state.customers.some(x=>x.id===c.id)?state.customers.map(x=>x.id===c.id?c:x):[...state.customers,c];if(c.applyTransferGroup&&c.status==='Transferred'&&c.groupName&&c.transferToTour){arr=arr.map(x=>x.tourCode===c.tourCode&&x.groupName===c.groupName&&x.status==='Active'?{...x,status:'Transferred',transferFromTour:x.transferFromTour||x.tourCode,transferToTour:c.transferToTour,transferToPerson:x.id===c.id?c.transferToPerson:x.transferToPerson}:x)}state.customers=arr;await writeRows(SHEETS.CUSTOMERS,CUST_COLS,arr);const changed=old.status&&old.status!==c.status;if(changed&&c.status==='Transferred')state.tasks.push(makeTask(c.tourCode,c.id,'Customer transferred to '+(c.transferToTour||'another tour'),'Transfer',fullName(c)+' transferred from '+c.tourCode+' to '+(c.transferToTour||'—')+'. '+(c.applyTransferGroup?'Applied to same group: '+(c.groupName||'—')+'.':'')));if(changed&&c.status==='Cancelled')state.tasks.push(makeTask(c.tourCode,c.id,'Customer cancelled tour - follow up refund / voucher / notice','Cancellation',fullName(c)+' cancelled. Check refund, voucher, bank details and informed cancellation column.'));await writeRows(SHEETS.TASKS,TASK_COLS,state.tasks);state.selectedTourCode=c.status==='Transferred'&&c.transferToTour?c.transferToTour:c.tourCode;state.view='tour';render()}
render();
